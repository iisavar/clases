<title>Números, iones e isótopos</title>
<meta name="description" content="Número atómico, número de masa, iones e isótopos, con un duelo y juegos para el celular.">

<body>
<div class="deck" id="deck"></div>

<template id="laminas">
<section data-titulo="1. El número atómico">
  <div class="inner">
    <h2>1. Z: la cédula del átomo</h2>
    <p>Ya sabemos que un átomo tiene protones, neutrones y electrones. Entonces, ¿qué hace que un átomo sea de oxígeno y no de hierro? Una sola cosa: cuántos protones tiene.</p>
    <div class="clave"><b>El número atómico (Z)</b> es la cantidad de protones del átomo. Cada elemento tiene el suyo y no se repite, igual que una cédula.</div>
    <table class="t">
      <tr><th>Elemento</th><th>Hidrógeno</th><th>Carbono</th><th>Oxígeno</th><th>Sodio</th><th>Hierro</th></tr>
      <tr><td>Z = protones</td><td>1</td><td>6</td><td>8</td><td>11</td><td>26</td></tr>
    </table>
    <p class="step" style="margin-top:14px">En un átomo neutro, los electrones son tantos como los protones, porque las cargas se compensan.</p>
    <div class="clave step"><b>Pregunta para el chat:</b> ¿cuántos electrones tiene un átomo neutro de oxígeno? Tiene 8, los mismos que sus protones.</div>
  </div>
</section>

<section data-titulo="2. El número de masa">
  <div class="inner">
    <h2>2. A: lo que pesa el núcleo</h2>
    <p>El electrón casi no pesa, así que la masa del átomo está en el núcleo. Para saber qué tan pesado es un átomo, contamos las partículas del núcleo.</p>
    <div class="clave"><b>El número de masa (A)</b> es la suma de protones y neutrones. También lo llaman número másico.</div>
    <svg class="dib" viewBox="-70 0 720 170" role="img" aria-label="Símbolo del sodio con el número de masa 23 arriba a la izquierda y el número atómico 11 abajo a la izquierda" style="max-width:820px;margin:0 auto">
      <g font-family="Nunito,sans-serif" font-weight="900" fill="#F1F5F7">
        <text x="330" y="118" font-size="96" text-anchor="middle">Na</text>
        <text x="262" y="62" font-size="34" text-anchor="end" fill="#FFC800">23</text>
        <text x="262" y="124" font-size="34" text-anchor="end" fill="#FF6B6B">11</text>
      </g>
      <g fill="none" stroke-width="3" stroke-linecap="round">
        <path d="M216 50H172" stroke="#FFC800"/><path d="M180 42l-9 8 9 8" stroke="#FFC800"/>
        <path d="M216 112H172" stroke="#FF6B6B"/><path d="M180 104l-9 8 9 8" stroke="#FF6B6B"/>
      </g>
      <g font-family="Nunito,sans-serif" font-weight="800" font-size="20" text-anchor="end">
        <text x="160" y="46" fill="#FFC800">A, número de masa</text>
        <text x="160" y="70" fill="#A9BCC4" font-size="17">protones + neutrones</text>
        <text x="160" y="108" fill="#FF6B6B">Z, número atómico</text>
        <text x="160" y="132" fill="#A9BCC4" font-size="17">protones</text>
      </g>
      <g font-family="Nunito,sans-serif" font-weight="800" font-size="20" fill="#F1F5F7">
        <text x="430" y="70">Na es el símbolo</text>
        <text x="430" y="98" fill="#A9BCC4" font-size="17">del sodio</text>
      </g>
    </svg>
    <div class="ejemplo step">Neutrones del sodio: A − Z = 23 − 11 = <span class="f">12</span><span class="paso">restamos los protones a las partículas del núcleo</span></div>
  </div>
</section>

<section data-titulo="3. Leer un átomo completo">
  <div class="inner">
    <h2>3. Leer un átomo completo</h2>
    <p>Con Z y A sale todo lo demás. Son siempre los mismos tres pasos.</p>
    <div class="pasos">
      <div><span class="n">1</span><b>Protones</b>Son iguales a Z.</div>
      <div><span class="n">2</span><b>Electrones</b>Si es neutro, iguales a Z.</div>
      <div><span class="n">3</span><b>Neutrones</b>Se calculan con A − Z.</div>
    </div>
    <table class="t">
      <tr><th>Átomo</th><th>Z</th><th>A</th><th><span class="p-c">Protones</span></th><th><span class="e-c">Electrones</span></th><th><span class="n-c">Neutrones</span></th></tr>
      <tr><td>Carbono</td><td>6</td><td>12</td><td>6</td><td>6</td><td>12 − 6 = 6</td></tr>
      <tr class="step"><td>Oxígeno</td><td>8</td><td>16</td><td>8</td><td>8</td><td>16 − 8 = 8</td></tr>
      <tr class="step"><td>Cloro</td><td>17</td><td>35</td><td>17</td><td>17</td><td>35 − 17 = 18</td></tr>
      <tr class="step"><td>Hierro</td><td>26</td><td>56</td><td>26</td><td>26</td><td>56 − 26 = 30</td></tr>
    </table>
    <div class="clave step"><b>Cuidado:</b> protones y neutrones no siempre son iguales. En el carbono coinciden, en el hierro no.</div>
  </div>
</section>

<section data-titulo="4. Iones">
  <div class="inner">
    <h2>4. Iones: cuando cambian los electrones</h2>
    <p>Los protones están bien amarrados en el núcleo, pero los electrones de afuera se pueden ir o llegar. Un átomo que gana o pierde electrones deja de ser neutro y se llama <b>ion</b>.</p>
    <svg class="dib" viewBox="0 0 900 220" role="img" aria-label="El sodio pierde un electrón y queda con carga positiva. El cloro gana un electrón y queda con carga negativa." style="max-width:860px;margin:0 auto">
      <g font-family="Nunito,sans-serif" font-weight="900" text-anchor="middle">
        <g fill="none" stroke="#2E4652" stroke-width="3"><circle cx="90" cy="96" r="66"/><circle cx="320" cy="96" r="66"/><circle cx="580" cy="96" r="66"/><circle cx="810" cy="96" r="66"/></g>
        <g fill="#FF6B6B"><circle cx="90" cy="96" r="30"/><circle cx="320" cy="96" r="30"/><circle cx="580" cy="96" r="30"/><circle cx="810" cy="96" r="30"/></g>
        <g fill="#0E1A1F" font-size="20"><text x="90" y="103">11+</text><text x="320" y="103">11+</text><text x="580" y="103">17+</text><text x="810" y="103">17+</text></g>
        <g fill="#4FB3E8" font-size="19"><text x="90" y="58">11 e</text><text x="320" y="58">10 e</text><text x="580" y="58">17 e</text><text x="810" y="58">18 e</text></g>
        <circle cx="205" cy="62" r="9" fill="#4FB3E8"/>
        <path d="M168 96h66M226 88l9 8-9 8" fill="none" stroke="#FFC800" stroke-width="3" stroke-linecap="round"/>
        <circle cx="695" cy="62" r="9" fill="#4FB3E8"/>
        <path d="M658 96h66M716 88l9 8-9 8" fill="none" stroke="#FFC800" stroke-width="3" stroke-linecap="round"/>
        <g fill="#F1F5F7" font-size="22"><text x="90" y="192">Na neutro</text><text x="320" y="192">Na<tspan dy="-9" font-size="15">+</tspan><tspan dy="9" font-size="17" fill="#A9BCC4"> catión</tspan></text><text x="580" y="192">Cl neutro</text><text x="810" y="192">Cl<tspan dy="-9" font-size="15">−</tspan><tspan dy="9" font-size="17" fill="#A9BCC4"> anión</tspan></text></g>
        <g fill="#A9BCC4" font-size="17"><text x="200" y="130">pierde 1</text><text x="690" y="130">gana 1</text></g>
      </g>
    </svg>
    <div class="grid2 step">
      <div class="card"><h3>Catión, ion positivo</h3><p style="margin:0">Perdió electrones. Perder algo negativo deja saldo a favor, como si te perdonaran una deuda.</p></div>
      <div class="card"><h3>Anión, ion negativo</h3><p style="margin:0">Ganó electrones. Ahora tiene más cargas negativas que positivas.</p></div>
    </div>
  </div>
</section>

<section data-titulo="5. Contar partículas de un ion">
  <div class="inner">
    <h2>5. Contar los electrones de un ion</h2>
    <p>Los protones no cambian, solo los electrones. La carga escrita arriba del símbolo te dice cuántos se fueron o cuántos llegaron.</p>
    <div class="clave"><b>Carga = protones − electrones.</b> Si la carga es +2, faltan 2 electrones. Si es −2, sobran 2.</div>
    <table class="t">
      <tr><th>Ion</th><th>Z</th><th>Qué pasó</th><th>Cuenta</th><th>Electrones</th></tr>
      <tr><td>Mg<sup>2+</sup></td><td>12</td><td>Perdió 2</td><td>12 − 2</td><td>10</td></tr>
      <tr class="step"><td>Al<sup>3+</sup></td><td>13</td><td>Perdió 3</td><td>13 − 3</td><td>10</td></tr>
      <tr class="step"><td>O<sup>2−</sup></td><td>8</td><td>Ganó 2</td><td>8 + 2</td><td>10</td></tr>
      <tr class="step"><td>Cl<sup>−</sup></td><td>17</td><td>Ganó 1</td><td>17 + 1</td><td>18</td></tr>
    </table>
    <div class="clave step"><b>Pregunta para el chat:</b> ¿cuántos electrones tiene el ion Ca<sup>2+</sup>, si el calcio tiene Z = 20? Perdió 2, así que tiene 18.</div>
  </div>
</section>

<section data-titulo="6. Isótopos">
  <div class="inner">
    <h2>6. Isótopos: el mismo elemento, otra masa</h2>
    <p>Ahora cambiamos otra partícula. Si dos átomos tienen los mismos protones y distintos neutrones, siguen siendo el mismo elemento, pero uno pesa más. Son <b>isótopos</b>.</p>
    <svg class="dib" viewBox="0 0 840 180" role="img" aria-label="Tres isótopos del hidrógeno: protio con un protón, deuterio con un protón y un neutrón, y tritio con un protón y dos neutrones. Los tres tienen un electrón." style="max-width:760px;margin:0 auto">
      <g fill="none" stroke="#2E4652" stroke-width="3"><circle cx="140" cy="76" r="62"/><circle cx="420" cy="76" r="62"/><circle cx="700" cy="76" r="62"/></g>
      <g fill="#4FB3E8"><circle cx="184" cy="32" r="9"/><circle cx="464" cy="32" r="9"/><circle cx="744" cy="32" r="9"/></g>
      <g fill="#FF6B6B"><circle cx="140" cy="76" r="17"/><circle cx="406" cy="76" r="17"/><circle cx="686" cy="66" r="17"/></g>
      <g fill="#8A9BA3"><circle cx="436" cy="76" r="17"/><circle cx="716" cy="66" r="17"/><circle cx="701" cy="96" r="17"/></g>
      <g font-family="Nunito,sans-serif" font-weight="900" font-size="20" fill="#F1F5F7" text-anchor="middle">
        <text x="140" y="166">Protio, A = 1</text><text x="420" y="166">Deuterio, A = 2</text><text x="700" y="166">Tritio, A = 3</text>
      </g>
    </svg>
    <p style="text-align:center;font-size:.86em;margin-bottom:6px"><span class="p-c">Rojo: protón.</span> <span class="n-c">Gris: neutrón.</span> <span class="e-c">Celeste: electrón.</span></p>
    <div class="clave step"><b>Se nombran con su A.</b> Carbono-12 y carbono-14 tienen 6 protones, con 6 y 8 neutrones. El carbono-14 se usa para calcular la edad de huesos y maderas antiguas.</div>
    <div class="clave step"><b>Pregunta para el chat:</b> ¿el carbono-14 y el nitrógeno-14 son isótopos? No: tienen 6 y 7 protones, son elementos distintos.</div>
  </div>
</section>

<section data-titulo="7. Por qué el cloro pesa 35,5">
  <div class="inner">
    <h2>7. ¿Por qué el cloro pesa 35,5?</h2>
    <p>En este curso usamos 35,5 como masa del cloro, y ningún átomo tiene medio neutrón. Ese número es un promedio. En la naturaleza, de cada 4 átomos de cloro, cerca de 3 son cloro-35 y 1 es cloro-37.</p>
    <div class="ejemplo step">Promedio = (35 + 35 + 35 + 37) ÷ 4 = 142 ÷ 4 = <span class="f">35,5</span></div>
    <p class="step">Es lo mismo que el promedio de tus notas: pesa más la nota que más se repite. Aquí pesa más el 35 porque hay más átomos de ese isótopo, y por eso el resultado queda cerca de 35.</p>
    <div class="clave step"><b>Masa de la tabla periódica:</b> es el promedio de los isótopos de cada elemento, según cuánto abunda cada uno. Por eso casi nunca es un número entero.</div>
    <table class="t step">
      <tr><th>Si cambia…</th><th>Tienes…</th><th>Ejemplo</th></tr>
      <tr><td>Protones</td><td>Otro elemento</td><td>Carbono y nitrógeno</td></tr>
      <tr><td>Electrones</td><td>Un ion</td><td>Na y Na<sup>+</sup></td></tr>
      <tr><td>Neutrones</td><td>Un isótopo</td><td>Carbono-12 y carbono-14</td></tr>
    </table>
  </div>
</section>
