<section data-titulo="1. Cinco familias más">
  <div class="inner">
    <h2>1. Cinco familias, dos piezas clave</h2>
    <p>Hoy conocemos cinco familias. Casi todo se decide por dos piezas. La primera es el <b>grupo carbonilo</b>, C=O: un carbono unido a un oxígeno con doble enlace. La segunda es el <b>nitrógeno</b>. Lo que cambia es dónde están y qué tienen al lado.</p>
    <svg class="dib" viewBox="0 0 1000 190" role="img" aria-label="Los cinco grupos funcionales: aldehído con el carbonilo en la punta, cetona con el carbonilo en medio, ácido con carbonilo y OH, éster con carbonilo y oxígeno unido a otra cadena, y amina con nitrógeno">
      <g stroke="#A9BCC4" stroke-width="3" fill="none">
        <path d="M46 92h34M104 92h34"/><path d="M90 76V52M97 76V52" stroke="#FFC800"/>
        <path d="M236 92h34M294 92h34"/><path d="M280 76V52M287 76V52" stroke="#FFC800"/>
        <path d="M426 92h34M484 92h34"/><path d="M470 76V52M477 76V52" stroke="#FFC800"/>
        <path d="M616 92h34M674 92h28M728 92h26"/><path d="M660 76V52M667 76V52" stroke="#FFC800"/>
        <path d="M856 92h34M914 92h20M902 104v22"/>
      </g>
      <g font-family="Nunito,sans-serif" font-weight="900" font-size="23" text-anchor="middle">
        <g fill="#F1F5F7"><text x="28" y="100">R</text><text x="218" y="100">R</text><text x="346" y="100">R</text><text x="408" y="100">R</text><text x="598" y="100">R</text><text x="776" y="100">R</text><text x="838" y="100">R</text></g>
        <g fill="#3BC97A"><text x="92" y="100">C</text><text x="282" y="100">C</text><text x="472" y="100">C</text><text x="662" y="100">C</text></g>
        <g fill="#FF6B6B"><text x="93" y="46">O</text><text x="283" y="46">O</text><text x="473" y="46">O</text><text x="663" y="46">O</text><text x="715" y="100">O</text></g>
        <g fill="#FFC800"><text x="152" y="100">H</text><text x="540" y="100">OH</text><text x="948" y="100">H</text><text x="902" y="146">H</text></g>

    </svg>
    <div class="clave step"><b>Recuerda.</b> La letra R significa «una cadena de carbonos». Fíjate en el aldehído: su carbonilo está en la punta, con un H al lado. En la cetona está en medio, con cadenas a los dos lados.</div>
  </div>
</section>

<section data-titulo="2. Aldehídos">
  <div class="inner">
    <h2>2. Aldehídos: el carbonilo en la punta</h2>
    <p>Se nombran con el prefijo de carbonos y la terminación <span class="f">-al</span>. Su grupo se escribe −CHO. Metano da metanal. Etano da etanal.</p>
    <table class="t">
      <tr><th>Nombre actual</th><th>Nombre común</th><th>Fórmula</th><th>Dónde está</th></tr>
      <tr><td>Metanal</td><td>Formaldehído, formol en agua</td><td>HCHO</td><td>Conserva muestras biológicas, resinas</td></tr>
      <tr><td>Etanal</td><td>Acetaldehído</td><td>CH<sub>3</sub>CHO</td><td>Se forma en el cuerpo al procesar el alcohol</td></tr>
    </table>
    <p style="margin-top:12px">No todos son peligrosos. La vainillina, que da su olor a la vainilla, y el aldehído de la canela también son de esta familia.</p>
    <div class="clave step"><b>Peligro real.</b> El formol irrita los ojos y los pulmones, y es cancerígeno. Algunos alisados de cabello lo contienen, y al plancharlo se respira su vapor. Es mala idea usarlos.</div>
    <div class="clave step"><b>Pregunta para el chat:</b> el formol conserva tejidos en un laboratorio. ¿Se podría usar para conservar comida? No. Es tóxico y está prohibido en los alimentos.</div>
  </div>
</section>

<section data-titulo="3. Cetonas">
  <div class="inner">
    <h2>3. Cetonas: el carbonilo en medio</h2>
    <p>Se nombran con el prefijo y la terminación <span class="f">-ona</span>. Como el carbonilo debe tener carbono a los dos lados, una cetona necesita <b>al menos tres carbonos</b>. Por eso no existen la «metanona» ni la «etanona».</p>
    <div class="grid2">
      <div class="card"><h3>Propanona: la acetona</h3><p style="margin:0 0 6px"><b>CH<sub>3</sub>COCH<sub>3</sub></b>, fórmula molecular C<sub>3</sub>H<sub>6</sub>O.</p><p style="margin:0">Es el quitaesmalte y disuelve pinturas y grasas. Se evapora rápido y es muy inflamable: no la uses cerca de una llama.</p></div>
      <div class="card"><h3>Butanona</h3><p style="margin:0 0 6px"><b>CH<sub>3</sub>COCH<sub>2</sub>CH<sub>3</sub></b>, fórmula molecular C<sub>4</sub>H<sub>8</sub>O.</p><p style="margin:0">Es un solvente de pinturas y pegamentos. También se la llama metiletilcetona.</p></div>
    </div>
    <div class="clave step"><b>Aldehído o cetona.</b> Propanal y propanona tienen la misma fórmula molecular, C<sub>3</sub>H<sub>6</sub>O. La diferencia es el lugar del carbonilo: en la punta o en medio. La terminación te lo dice: -al o -ona.</div>
  </div>
</section>

<section data-titulo="4. Ácidos carboxílicos">
  <div class="inner">
    <h2>4. Ácidos carboxílicos: el ácido del vinagre</h2>
    <p>Tienen el grupo <span class="f">−COOH</span>. Se nombran con la palabra ácido, el prefijo y la terminación <span class="f">-oico</span>. Son ácidos débiles: sueltan pocos H<sup>+</sup>, como vimos en la clase de pH.</p>
    <table class="t">
      <tr><th>Nombre actual</th><th>Nombre común</th><th>Fórmula</th><th>Dónde está</th></tr>
      <tr><td>Ácido metanoico</td><td>Ácido fórmico</td><td>HCOOH</td><td>Picadura de hormiga</td></tr>
      <tr><td>Ácido etanoico</td><td>Ácido acético</td><td>CH<sub>3</sub>COOH</td><td>Vinagre</td></tr>
      <tr><td>Ácido butanoico</td><td>Ácido butírico</td><td>CH<sub>3</sub>CH<sub>2</sub>CH<sub>2</sub>COOH</td><td>Mantequilla rancia</td></tr>
    </table>
    <div class="ejemplo step"><b>Ejemplo.</b> Un vinagre tiene 5 g de ácido etanoico en cada 100 mL. ¿Cuántos gramos hay en una botella de 500 mL? 500 mL × 5 g ÷ 100 mL = <b>25 g</b>. ¿Cuántos moles? La masa molar es 60 g/mol, así que 25 ÷ 60 = <b>0,42 mol</b>.</div>
    <div class="clave step"><b>Pregunta para el chat:</b> ¿y el sabor agrio de la naranja? Viene del ácido cítrico, que también es carboxílico. El yogur es agrio por el ácido láctico.</div>
  </div>
</section>

<section data-titulo="5. Ésteres">
  <div class="inner">
    <h2>5. Ésteres: el olor de las frutas</h2>
    <p>Un ácido y un alcohol pueden unirse y soltar agua. Lo que se forma es un <b>éster</b>. El nombre sale del ácido, que cambia -oico por <span class="f" style="white-space:nowrap">-oato</span>, y de la cadena del alcohol, que termina en -ilo.</p>
    <svg class="dib" viewBox="0 0 980 130" role="img" aria-label="Ácido etanoico más etanol forman etanoato de etilo más agua" style="max-width:940px;margin:0 auto">
      <g font-family="Nunito,sans-serif" font-weight="900" font-size="24" text-anchor="middle" fill="#F1F5F7">
        <text x="110" y="52">CH<tspan dy="6" font-size="16">3</tspan><tspan dy="-6">CO</tspan><tspan fill="#FF6B6B">OH</tspan></text>
        <text x="225" y="52">+</text>
        <text x="350" y="52"><tspan fill="#FFC800">H</tspan>OCH<tspan dy="6" font-size="16">2</tspan><tspan dy="-6">CH</tspan><tspan dy="6" font-size="16">3</tspan></text>
        <text x="478" y="52" fill="#A9BCC4">→</text>
        <text x="650" y="52">CH<tspan dy="6" font-size="16">3</tspan><tspan dy="-6">COOCH</tspan><tspan dy="6" font-size="16">2</tspan><tspan dy="-6">CH</tspan><tspan dy="6" font-size="16">3</tspan></text>
        <text x="808" y="52">+</text>
        <text x="880" y="52"><tspan fill="#FFC800">H</tspan><tspan fill="#FF6B6B" dy="6" font-size="16">2</tspan><tspan fill="#FF6B6B" dy="-6">O</tspan></text>
      </g>
      <g font-family="Nunito,sans-serif" font-weight="800" font-size="17" text-anchor="middle" fill="#A9BCC4"><text x="110" y="92">Ácido etanoico</text><text x="350" y="92">Etanol</text><text x="650" y="92">Etanoato de etilo</text><text x="880" y="92">Agua</text>
        <text x="650" y="118" fill="#3BC97A">Olor a quitaesmalte y a frutas</text></g>
    </svg>
    <table class="t step">
      <tr><th>Éster</th><th>Olor o uso</th></tr>
      <tr><td>Etanoato de etilo o acetato de etilo</td><td>Solvente de algunos quitaesmaltes</td></tr>
      <tr><td>Butanoato de etilo</td><td>Olor a piña en jugos y dulces</td></tr>
      <tr><td>Acetato de isoamilo</td><td>Olor a plátano</td></tr>
    </table>
    <div class="clave step"><b>Las grasas y los aceites también son ésteres.</b> Lo veremos en la próxima clase, cuando hablemos del jabón.</div>
  </div>
</section>

<section data-titulo="6. Aminas">
  <div class="inner">
    <h2>6. Aminas: el nitrógeno y el olor a pescado</h2>
    <p>Las aminas vienen del amoniaco, NH<sub>3</sub>, cuando se cambia un hidrógeno o más por cadenas de carbono. Su grupo más simple es <span class="f">−NH<sub>2</sub></span>. Se nombran con la cadena y la palabra <span class="f">amina</span>.</p>
    <div class="grid3">
      <div class="card"><h3>Metilamina</h3><p style="margin:0"><b>CH<sub>3</sub>NH<sub>2</sub></b>. Un gas de olor fuerte, parecido al amoniaco.</p></div>
      <div class="card"><h3>Trimetilamina</h3><p style="margin:0"><b>(CH<sub>3</sub>)<sub>3</sub>N</b>. Da el olor del pescado que ya no está fresco.</p></div>
      <div class="card"><h3>Fenilamina o anilina</h3><p style="margin:0"><b>C<sub>6</sub>H<sub>5</sub>NH<sub>2</sub></b>. Materia prima de colorantes. Es tóxica.</p></div>
    </div>
    <div class="clave step"><b>Son bases débiles, como el amoniaco.</b> Por eso el limón quita el olor del pescado: el ácido neutraliza la amina y forma una sal que no se evapora.</div>
    <div class="clave step"><b>Están en tu cuerpo.</b> La adrenalina y la dopamina son aminas. Los aminoácidos, que forman las proteínas, tienen un grupo amina y un grupo ácido.</div>
  </div>
</section>

<section data-titulo="7. Cómo reconocerlas">
  <div class="inner">
    <h2>7. Cómo reconocer cada familia</h2>
    <p>Este es el resumen de las tres clases de química orgánica. Busca primero la terminación del nombre o el grupo de la fórmula.</p>
    <table class="t">
      <tr><th>Familia</th><th>Grupo</th><th>Terminación</th><th>Ejemplo</th></tr>
      <tr><td>Alcano, alqueno, alquino</td><td>C−C, C=C, C≡C</td><td>-ano, -eno, -ino</td><td>Propano, eteno, etino</td></tr>
      <tr><td>Alcohol</td><td>−OH</td><td>-ol</td><td>Etanol</td></tr>
      <tr><td>Aldehído</td><td>−CHO</td><td>-al</td><td>Metanal</td></tr>
      <tr><td>Cetona</td><td>−CO− en medio</td><td>-ona</td><td>Propanona</td></tr>
      <tr><td>Ácido carboxílico</td><td>−COOH</td><td>ácido …-oico</td><td>Ácido etanoico</td></tr>
      <tr><td>Éster</td><td>−COO−</td><td>…-oato de …-ilo</td><td>Etanoato de etilo</td></tr>
      <tr><td>Amina</td><td>−NH<sub>2</sub></td><td>-amina</td><td>Metilamina</td></tr>
    </table>
    <div class="clave step"><b>Trampa de la terminación.</b> Etanol tiene -ol, etanal tiene -al y etanoico tiene -oico. Una o dos letras cambian toda la familia: lee el nombre despacio.</div>
  </div>
</section>
