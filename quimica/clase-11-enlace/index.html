<section data-titulo="1. Por qué se unen los átomos">
  <div class="inner">
    <h2>1. ¿Por qué se unen los átomos?</h2>
    <p>Casi nada en la naturaleza está hecho de átomos sueltos. Los únicos que viven solos, tranquilos, son los gases nobles. ¿Qué tienen de especial? Tienen 8 electrones en su última capa, y el helio 2.</p>
    <div class="clave"><b>Regla del octeto:</b> los átomos se unen para quedar con 8 electrones en su última capa, como un gas noble.</div>
    <p class="step">Ya lo vimos sin ponerle nombre: Na<sup>+</sup> quedó igual que el neón y Cl<sup>−</sup> igual que el argón. Hay tres maneras de llegar.</p>
    <div class="grid3 step">
      <div class="card"><h3>Ceder</h3><p style="margin:0">Un metal entrega electrones.</p></div>
      <div class="card"><h3>Recibir</h3><p style="margin:0">Un no metal toma electrones.</p></div>
      <div class="card"><h3>Compartir</h3><p style="margin:0">Dos no metales ponen electrones en común.</p></div>
    </div>
    <div class="clave step"><b>La excepción más útil:</b> el hidrógeno se completa con 2 electrones, como el helio.</div>
  </div>
</section>

<section data-titulo="2. Símbolos de Lewis">
  <div class="inner">
    <h2>2. Los símbolos de Lewis</h2>
    <p>Para ver qué pasa en un enlace solo necesitamos los electrones de valencia. Gilbert Lewis los dibujó como puntos alrededor del símbolo. El grupo te dice cuántos poner.</p>

    <div class="clave step"><b>Cómo se dibujan:</b> un punto por cada lado, y cuando ya hay uno en cada lado se forman pares. Los puntos solos son los que buscan enlace.</div>
    <div class="clave step"><b>Pregunta para el chat:</b> ¿cuántos puntos lleva el azufre, del grupo 16? Lleva 6, igual que el oxígeno, porque son de la misma familia.</div>

<section data-titulo="3. Enlace iónico">
  <div class="inner">
    <h2>3. Enlace iónico: uno da y otro recibe</h2>
    <p>Recuerda la clase pasada: al sodio le cuesta poco soltar su electrón y al cloro le falta uno. Cuando se encuentran, el electrón pasa del metal al no metal.</p>

    <div class="clave step"><b>Enlace iónico:</b> es la atracción entre iones de carga contraria. Por lo general se forma entre un metal y un no metal.</div>
    <p class="step">Los iones no quedan en parejas sueltas. Millones de ellos se ordenan en un cristal, y por eso la sal de cocina forma cubitos que puedes ver con una lupa.</p>
  </div>
</section>

<section data-titulo="4. La fórmula de un compuesto iónico">
  <div class="inner">
    <h2>4. ¿Cuántos iones hacen falta?</h2>
    <p>La regla es simple: un compuesto es neutro, así que las cargas positivas y negativas deben sumar cero.</p>
    <table class="t">
      <tr><th>Iones</th><th>Cuenta</th><th>Fórmula</th></tr>
      <tr><td>Na<sup>+</sup> y Cl<sup>−</sup></td><td>+1 − 1 = 0</td><td>NaCl</td></tr>
      <tr class="step"><td>Mg<sup>2+</sup> y O<sup>2−</sup></td><td>+2 − 2 = 0</td><td>MgO</td></tr>
      <tr class="step"><td>Ca<sup>2+</sup> y Cl<sup>−</sup></td><td>+2 − 1 − 1 = 0</td><td>CaCl<sub>2</sub></td></tr>
      <tr class="step"><td>Al<sup>3+</sup> y O<sup>2−</sup></td><td>2 × (+3) + 3 × (−2) = 0</td><td>Al<sub>2</sub>O<sub>3</sub></td></tr>
    </table>
    <div class="clave step"><b>Truco:</b> la carga de un ion pasa a ser el subíndice del otro. Con Al<sup>3+</sup> y O<sup>2−</sup>, el 3 baja al oxígeno y el 2 baja al aluminio. Si quedan simplificables, se simplifican: Mg<sub>2</sub>O<sub>2</sub> se escribe MgO.</div>
    <div class="clave step"><b>Pregunta para el chat:</b> ¿cuál es la fórmula entre K<sup>+</sup> y O<sup>2−</sup>? K<sub>2</sub>O, porque hacen falta dos potasios por cada oxígeno.</div>
  </div>
</section>

<section data-titulo="5. Enlace covalente">
  <div class="inner">
    <h2>5. Enlace covalente: compartir electrones</h2>
    <p>Dos no metales quieren recibir electrones y ninguno quiere soltarlos. La salida es compartir: cada uno pone electrones y los usan entre los dos, como dos amigos que ponen plata para una pizza que ninguno podría pagar solo.</p>
    <div class="clave"><b>Enlace covalente:</b> dos átomos comparten pares de electrones. Se forma entre no metales. Cada raya es un par compartido.</div>

="4.5" fill="#4FB3E8"/><circle cx="640" cy="67" r="4.5" fill="#4FB3E8"/><circle cx="800" cy="53" r="4.5" fill="#4FB3E8"/><circle cx="800" cy="67" r="4.5" fill="#4FB3E8"/><g font-size="18" fill="#F1F5F7" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="900"><text x="145" y="128">Simple, 1 par</text><text x="430" y="128">Doble, 2 pares</text><text x="720" y="128">Triple, 3 pares</text></g></svg>
    <p class="step">El hidrógeno comparte 1 par y llega a 2 electrones. Al oxígeno le faltan 2 y comparte 2 pares. Al nitrógeno le faltan 3 y comparte 3 pares. El grupo de átomos unidos así se llama <b>molécula</b>.</p>

<section data-titulo="6. Estructura de Lewis de una molécula">
  <div class="inner">
    <h2>6. La estructura de Lewis, paso a paso</h2>
    <div class="pasos">
      <div><span class="n">1</span><b>Cuenta</b>Suma los electrones de valencia. Agua: 1 + 1 + 6 = 8.</div>
      <div class="step"><span class="n">2</span><b>Ubica</b>Al centro va el átomo que forma más enlaces. El H nunca va al centro.</div>
      <div class="step"><span class="n">3</span><b>Une</b>Une cada H al oxígeno con un enlace. Usaste 2 pares, 4 electrones.</div>
      <div class="step"><span class="n">4</span><b>Completa</b>Los 4 que quedan van en pares libres sobre el oxígeno.</div>
      <div class="step"><span class="n">5</span><b>Revisa</b>Cada H con 2, y el O con 8.</div>
    </div>

      <p style="margin:0">En un metal, los átomos sueltan sus electrones de valencia y estos quedan libres entre los iones positivos, como un <b>mar de electrones</b>. Ese mar explica por qué un cable conduce la corriente y por qué el metal se dobla sin romperse.</p>
