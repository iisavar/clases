<template id="laminas">
<section data-titulo="1. La química está en todo">
  <div class="inner">
    <h2>1. La química está en todo lo que te rodea</h2>
    <p>Esta mañana ya hiciste química sin darte cuenta. Te bañaste con jabón, que atrapa la grasa. Comiste algo cocinado, y el calor cambió sus sustancias. Tu celular funciona porque dentro de la batería ocurre una reacción.</p>
    <div class="clave"><b>La química</b> es la ciencia que estudia la materia, sus propiedades y cómo se transforma.</div>
    <div class="grid3 step">
      <div class="card"><h3>En la cocina</h3><p style="margin:0">El pan se dora al tostarlo y aparece un sabor nuevo.</p></div>
      <div class="card"><h3>En tu cuerpo</h3><p style="margin:0">Respiras oxígeno y tus células lo usan para sacar energía de la comida.</p></div>
      <div class="card"><h3>En la calle</h3><p style="margin:0">Una reja se oxida y un carro quema gasolina para moverse.</p></div>
    </div>
  </div>
</section>

<section data-titulo="2. Qué es la materia">
  <div class="inner">
    <h2>2. ¿Qué es la materia?</h2>
    <p>La palabra clave de la definición es «materia». La materia es todo lo que tiene masa y ocupa espacio. El agua lo es, tu silla también, y el aire aunque no lo veas: por eso un globo se infla.</p>
    <div class="grid2">
      <div class="card"><h3>Sí es materia</h3><p style="margin:0">Agua, aire, una piedra, tu cuerpo, el vapor de la olla.</p></div>
      <div class="card"><h3>No es materia</h3><p style="margin:0">La luz, el sonido, el calor y las ideas. No se pueden poner en una balanza.</p></div>
    </div>
    <div class="clave step"><b>Pregunta para el chat:</b> ¿el humo de una vela es materia? Sí, porque son partículas y gases que tienen masa y ocupan espacio.</div>
  </div>
</section>

<section data-titulo="3. Las ramas de la química">
  <div class="inner">
    <h2>3. Las ramas de la química</h2>
    <p>La química es enorme, así que se divide por lo que estudia. Las dos primeras ramas de esta tabla las veremos con mucho detalle en el curso.</p>
    <table class="t">
      <tr><th>Rama</th><th>Qué estudia</th><th>Ejemplo</th></tr>
      <tr><td>Inorgánica</td><td>Compuestos que en general no tienen cadenas de carbono</td><td>Sal de mesa, ácido de batería</td></tr>
      <tr><td>Orgánica</td><td>Compuestos del carbono</td><td>Alcohol, gasolina, azúcar</td></tr>
      <tr><td>Bioquímica</td><td>Sustancias de los seres vivos</td><td>Proteínas, ADN</td></tr>
      <tr><td>Analítica</td><td>Qué contiene una muestra y cuánto</td><td>Examen de sangre, control del agua</td></tr>
      <tr><td>Fisicoquímica</td><td>La energía y la rapidez de los cambios</td><td>Por qué el calor acelera una reacción</td></tr>
    </table>
  </div>
</section>

<section data-titulo="4. Cómo trabaja la ciencia">
  <div class="inner">
    <h2>4. ¿Cómo sabemos lo que sabemos?</h2>
    <p>Lo que dice la química no se inventa: se comprueba. Veamos un caso real. En la costa, las rejas se oxidan más rápido que en la sierra. ¿Por qué será?</p>
    <div class="pasos">
      <div class="step"><span class="n">1</span><b>Observar</b>Las rejas cerca del mar se oxidan más rápido.</div>
      <div class="step"><span class="n">2</span><b>Preguntar</b>¿La sal acelera la oxidación del hierro?</div>
      <div class="step"><span class="n">3</span><b>Hipótesis</b>Si el agua tiene sal, entonces el clavo se oxida más rápido.</div>
      <div class="step"><span class="n">4</span><b>Experimento</b>Dos vasos iguales, un clavo en cada uno. Uno con sal y otro sin sal.</div>
      <div class="step"><span class="n">5</span><b>Conclusión</b>El clavo en agua con sal se oxidó más. La hipótesis se sostiene.</div>
    </div>
    <div class="clave step"><b>Esto se llama método científico.</b> Si el resultado hubiera sido otro, no estaría mal: se cambia la hipótesis y se prueba de nuevo.</div>
    <div class="clave step"><b>Pregunta para el chat:</b> ¿qué hipótesis harías para saber si la lluvia oxida más rápido que el agua de la llave? Escríbela con «si…, entonces…».</div>
  </div>
</section>

<section data-titulo="5. Un buen experimento">
  <div class="inner">
    <h2>5. ¿Qué hace bueno a un experimento?</h2>
    <p>Mira los dos vasos del caso. Si en uno pones más agua o un clavo distinto, ya no sabrás si la diferencia la causó la sal. Por eso se cambia una sola cosa a la vez.</p>
    <svg class="dib" viewBox="0 0 640 190" role="img" aria-label="Dos vasos con un clavo cada uno: el de la izquierda tiene agua sola y es el grupo de control, el de la derecha tiene agua con sal" style="max-width:640px;margin:0 auto">
      <g fill="none" stroke="#A9BCC4" stroke-width="3"><path d="M120 30v110a12 12 0 0 0 12 12h76a12 12 0 0 0 12-12V30"/><path d="M420 30v110a12 12 0 0 0 12 12h76a12 12 0 0 0 12-12V30"/></g>
      <path d="M122 70h96v70a10 10 0 0 1-10 10h-76a10 10 0 0 1-10-10z" fill="#4FB3E8" opacity=".3"/>
      <path d="M422 70h96v70a10 10 0 0 1-10 10h-76a10 10 0 0 1-10-10z" fill="#4FB3E8" opacity=".3"/>
      <rect x="166" y="55" width="8" height="85" rx="2" fill="#C0C9CE"/><rect x="156" y="52" width="28" height="6" rx="2" fill="#C0C9CE"/>
      <rect x="466" y="55" width="8" height="85" rx="2" fill="#D08C55"/><rect x="456" y="52" width="28" height="6" rx="2" fill="#D08C55"/>
      <g fill="#F1F5F7"><circle cx="440" cy="110" r="3"/><circle cx="452" cy="132" r="3"/><circle cx="492" cy="96" r="3"/><circle cx="502" cy="124" r="3"/><circle cx="486" cy="140" r="3"/></g>
      <g fill="#F1F5F7" font-family="Nunito,sans-serif" font-size="17" font-weight="800" text-anchor="middle"><text x="170" y="178">Sin sal: grupo de control</text><text x="470" y="178">Con sal: lo que se prueba</text></g>
    </svg>
    <div class="grid2 step">
      <div class="card"><h3>Variable</h3><p style="margin:0">Lo que se cambia a propósito. Aquí, la sal.</p></div>
      <div class="card"><h3>Grupo de control</h3><p style="margin:0">El que se deja sin cambiar, para comparar.</p></div>
    </div>
    <div class="clave step"><b>Ley y teoría.</b> Una ley describe lo que siempre pasa. Una teoría explica por qué pasa. Ninguna es una simple opinión: las dos se apoyan en muchas pruebas.</div>
  </div>
</section>

<section data-titulo="6. Para comparar hay que medir">
  <div class="inner">
    <h2>6. Para comparar, hay que medir</h2>
    <p>Hay un problema con nuestro experimento. Decir «se oxidó más» es una impresión: otra persona podría no estar de acuerdo. Si pesamos el clavo antes y después, tenemos un número que cualquiera puede comprobar.</p>
    <div class="grid2">
      <div class="card"><h3>Con palabras</h3><p style="margin:0">«Se oxidó bastante.»</p></div>
      <div class="card"><h3>Con una medida</h3><p style="margin:0">«Su masa pasó de 5,00 g a 5,08 g.»</p></div>
    </div>
    <div class="clave step"><b>Sin medir no hay ciencia.</b> Por eso, antes de estudiar la materia, vamos a aprender a medirla.</div>
  </div>
</section>
</template>
