<template id="laminas">
<section data-titulo="1. Por qué el carbono es especial">
  <div class="inner">
    <h2>1. ¿Por qué el carbono es especial?</h2>
    <p>Se conocen millones de compuestos con carbono. Están en la gasolina, el plástico, la comida y tu cuerpo. Todo se debe a dos cosas que el carbono hace muy bien.</p>
    <svg class="dib" viewBox="0 0 760 170" role="img" aria-label="A la izquierda, un carbono unido a cuatro hidrógenos. A la derecha, una cadena de seis carbonos unidos entre sí" style="max-width:700px;margin:0 auto">
      <g stroke="#A9BCC4" stroke-width="4" fill="none"><path d="M170 75H100M170 75h70M170 75V25M170 75v50"/><path d="M430 90l50-30 50 30 50-30 50 30 50-30"/></g>
      <g font-family="Nunito,sans-serif" font-weight="900" text-anchor="middle">
        <g fill="#3BC97A"><circle cx="170" cy="75" r="24"/></g><text x="170" y="82" font-size="20" fill="#0E1A1F">C</text>
        <g fill="#FFC800"><circle cx="96" cy="75" r="14"/><circle cx="244" cy="75" r="14"/><circle cx="170" cy="23" r="14"/><circle cx="170" cy="127" r="14"/></g>
        <g font-size="15" fill="#0E1A1F"><text x="96" y="80">H</text><text x="244" y="80">H</text><text x="170" y="28">H</text><text x="170" y="132">H</text></g>
        <g fill="#3BC97A"><circle cx="430" cy="90" r="20"/><circle cx="480" cy="60" r="20"/><circle cx="530" cy="90" r="20"/><circle cx="580" cy="60" r="20"/><circle cx="630" cy="90" r="20"/><circle cx="680" cy="60" r="20"/></g>
        <g font-size="17" fill="#0E1A1F"><text x="430" y="96">C</text><text x="480" y="66">C</text><text x="530" y="96">C</text><text x="580" y="66">C</text><text x="630" y="96">C</text><text x="680" y="66">C</text></g>
        <g font-size="17" font-weight="800" fill="#F1F5F7"><text x="170" y="162">Forma 4 enlaces</text><text x="555" y="162">Se une a otros carbonos en cadena</text></g>
      </g>
    </svg>
    <div class="grid2 step">
      <div class="card"><h3>Química orgánica</h3><p style="margin:0">Estudia los compuestos del carbono. El CO<sub>2</sub> y los carbonatos, por tradición, se estudian en inorgánica.</p></div>
      <div class="card"><h3>Hidrocarburos</h3><p style="margin:0">Son los compuestos más simples: solo carbono e hidrógeno. Vienen del petróleo y del gas natural.</p></div>
    </div>
  </div>
</section>

<section data-titulo="2. Tres formas de escribir">
  <div class="inner">
    <h2>2. Tres formas de escribir la misma molécula</h2>
    <p>Mira el propano, el gas de tres carbonos. Se puede escribir con mucho o con poco detalle. Las tres formas dicen lo mismo.</p>
    <svg class="dib" viewBox="0 0 900 190" role="img" aria-label="El propano en tres formas: desarrollada con todos sus enlaces, semidesarrollada CH3 CH2 CH3 y molecular C3H8" style="max-width:860px;margin:0 auto">
      <g stroke="#A9BCC4" stroke-width="3"><path d="M26 85h34M84 85h46M154 85h46M224 85h34"/><path d="M72 40v30M142 40v30M212 40v30M72 100v30M142 100v30M212 100v30"/></g>
      <g font-family="Nunito,sans-serif" font-weight="900" font-size="24" text-anchor="middle">
        <g fill="#3BC97A"><text x="72" y="94">C</text><text x="142" y="94">C</text><text x="212" y="94">C</text></g>
        <g fill="#FFC800"><text x="14" y="94">H</text><text x="270" y="94">H</text><text x="72" y="33">H</text><text x="142" y="33">H</text><text x="212" y="33">H</text><text x="72" y="154">H</text><text x="142" y="154">H</text><text x="212" y="154">H</text></g>
      </g>
      <g font-family="Nunito,sans-serif" font-weight="900" text-anchor="middle" fill="#F1F5F7">
        <text x="490" y="94" font-size="27">CH<tspan dy="7" font-size="18">3</tspan><tspan dy="-7"> − CH</tspan><tspan dy="7" font-size="18">2</tspan><tspan dy="-7"> − CH</tspan><tspan dy="7" font-size="18">3</tspan></text>
        <text x="800" y="94" font-size="32" fill="#FFC800">C<tspan dy="7" font-size="20">3</tspan><tspan dy="-7">H</tspan><tspan dy="7" font-size="20">8</tspan></text>
      </g>
      <g font-family="Nunito,sans-serif" font-weight="800" font-size="17" text-anchor="middle" fill="#A9BCC4"><text x="142" y="184">Desarrollada: todos los enlaces</text><text x="490" y="184">Semidesarrollada: por grupos</text><text x="800" y="184">Molecular: solo cuántos</text></g>
    </svg>
    <div class="clave step"><b>Cómo leerla.</b> Cada carbono tiene 4 enlaces. Los carbonos de las puntas llevan 3 hidrógenos. Los de en medio llevan 2, porque gastan dos enlaces en los carbonos vecinos.</div>
    <div class="clave step"><b>Pregunta para el chat:</b> si la cadena tuviera cuatro carbonos, ¿cuántos hidrógenos tendría? Dos puntas de 3 y dos carbonos de en medio de 2: 3 + 2 + 2 + 3 = 10.</div>
  </div>
</section>

<section data-titulo="3. Los prefijos">
  <div class="inner">
    <h2>3. El nombre empieza contando carbonos</h2>
    <p>El nombre de un compuesto orgánico se arma por partes. El comienzo, llamado prefijo, dice cuántos carbonos tiene la cadena. Son diez y hay que saberlos en orden.</p>
    <div class="grid5">
      <div class="card" style="text-align:center;padding:12px"><h3 style="margin:0">1</h3><b>met-</b></div>
      <div class="card" style="text-align:center;padding:12px"><h3 style="margin:0">2</h3><b>et-</b></div>
      <div class="card" style="text-align:center;padding:12px"><h3 style="margin:0">3</h3><b>prop-</b></div>
      <div class="card" style="text-align:center;padding:12px"><h3 style="margin:0">4</h3><b>but-</b></div>
      <div class="card" style="text-align:center;padding:12px"><h3 style="margin:0">5</h3><b>pent-</b></div>
      <div class="card" style="text-align:center;padding:12px"><h3 style="margin:0">6</h3><b>hex-</b></div>
      <div class="card" style="text-align:center;padding:12px"><h3 style="margin:0">7</h3><b>hept-</b></div>
      <div class="card" style="text-align:center;padding:12px"><h3 style="margin:0">8</h3><b>oct-</b></div>
      <div class="card" style="text-align:center;padding:12px"><h3 style="margin:0">9</h3><b>non-</b></div>
      <div class="card" style="text-align:center;padding:12px"><h3 style="margin:0">10</h3><b>dec-</b></div>
    </div>
    <div class="clave step"><b>Truco.</b> Los cuatro primeros se memorizan: met, et, prop, but. Desde cinco ya los conoces por las figuras: pentágono, hexágono, heptágono, octágono, nonágono y decágono.</div>
    <div class="clave step"><b>La terminación dice el tipo de enlace.</b> <span class="f">-ano</span> para enlaces simples, <span class="f">-eno</span> para un doble enlace, <span class="f">-ino</span> para un triple enlace. Prefijo más terminación: prop + ano = propano.</div>
  </div>
</section>

<section data-titulo="4. Alcanos">
  <div class="inner">
    <h2>4. Alcanos: solo enlaces simples</h2>
    <p>Los alcanos solo tienen enlaces simples entre carbonos. Cada carbono lleva todos los hidrógenos posibles, por eso se llaman saturados. Su fórmula general es <span class="f">C<sub>n</sub>H<sub>2n+2</sub></span>, donde n es el número de carbonos.</p>
    <div class="ejemplo step"><b>Ejemplo: octano.</b> Oct- son 8 carbonos, n = 8. Hidrógenos: 2 × 8 + 2 = 18. Fórmula: <b>C<sub>8</sub>H<sub>18</sub></b>.</div>
    <table class="t">
      <tr><th>Nombre</th><th>Fórmula</th><th>Dónde lo encuentras</th></tr>
      <tr><td>Metano</td><td>CH<sub>4</sub></td><td>Gas natural y biogás de la basura</td></tr>
      <tr><td>Etano</td><td>C<sub>2</sub>H<sub>6</sub></td><td>Gas natural, en menor cantidad</td></tr>
      <tr><td>Propano y butano</td><td>C<sub>3</sub>H<sub>8</sub> y C<sub>4</sub>H<sub>10</sub></td><td>El cilindro de gas de la cocina es una mezcla de los dos</td></tr>
      <tr><td>Octano</td><td>C<sub>8</sub>H<sub>18</sub></td><td>Parte de la gasolina</td></tr>
    </table>
    <div class="clave step"><b>Pregunta para el chat:</b> ¿cuál es la fórmula del pentano? n = 5, hidrógenos 2 × 5 + 2 = 12. Entonces C<sub>5</sub>H<sub>12</sub>.</div>
  </div>
</section>

<section data-titulo="5. Alquenos">
  <div class="inner">
    <h2>5. Alquenos: un doble enlace</h2>
    <p>Si dos carbonos se unen con doble enlace, cada uno gasta un enlace más entre ellos y la molécula pierde dos hidrógenos. Por eso es insaturada. Su fórmula general es <span class="f">C<sub>n</sub>H<sub>2n</sub></span> y su nombre termina en -eno.</p>
    <div class="ejemplo step"><b>Ejemplo: propeno.</b> Prop- son 3 carbonos, n = 3. Hidrógenos: 2 × 3 = 6. Fórmula: <b>C<sub>3</sub>H<sub>6</sub></b>.</div>
    <div class="grid2">
      <div class="card"><h3>Eteno, C<sub>2</sub>H<sub>4</sub></h3><p style="margin:0">Su nombre común es <b>etileno</b>. Es un gas que sueltan las frutas al madurar: por eso un plátano maduro apura a los demás. Con él se fabrica el plástico de las fundas.</p></div>
      <div class="card"><h3>Propeno, C<sub>3</sub>H<sub>6</sub></h3><p style="margin:0">Su nombre común es <b>propileno</b>. Con él se fabrica el plástico de muchas tapas y tarrinas.</p></div>
    </div>
    <div class="clave step"><b>Dos detalles.</b> No existe el «meteno», porque se necesitan dos carbonos para un doble enlace. Y desde cuatro carbonos el doble enlace puede estar en lugares distintos, así que el nombre completo lleva un número, como but-1-eno. Con el triple enlace pasa igual. Aquí usaremos el nombre base.</div>
  </div>
</section>

<section data-titulo="6. Alquinos">
  <div class="inner">
    <h2>6. Alquinos: un triple enlace</h2>
    <p>Con un triple enlace la molécula pierde otros dos hidrógenos. Su fórmula general es <span class="f">C<sub>n</sub>H<sub>2n−2</sub></span> y su nombre termina en -ino. Compara las tres familias con dos carbonos.</p>
    <svg class="dib" viewBox="0 0 900 170" role="img" aria-label="Etano con enlace simple y seis hidrógenos, eteno con doble enlace y cuatro hidrógenos, etino con triple enlace y dos hidrógenos" style="max-width:820px;margin:0 auto">
      <g stroke="#A9BCC4" stroke-width="3">
        <path d="M34 72h26M84 72h52M160 72h26M72 28v30M148 28v30M72 86v30M148 86v30"/>
        <path d="M358 62l-26-26M358 82l-26 26M478 62l26-26M478 82l26 26"/><path d="M382 66h72M382 78h72" stroke="#FFC800"/>
        <path d="M618 72h26M668 60h84M668 72h84M668 84h84M776 72h26" /></g>
      <path d="M668 60h84M668 72h84M668 84h84" stroke="#FFC800" stroke-width="3"/>
      <g font-family="Nunito,sans-serif" font-weight="900" font-size="23" text-anchor="middle">
        <g fill="#3BC97A"><text x="72" y="81">C</text><text x="148" y="81">C</text><text x="370" y="81">C</text><text x="466" y="81">C</text><text x="656" y="81">C</text><text x="764" y="81">C</text></g>
        <g fill="#FFC800"><text x="22" y="81">H</text><text x="198" y="81">H</text><text x="72" y="23">H</text><text x="148" y="23">H</text><text x="72" y="138">H</text><text x="148" y="138">H</text>
          <text x="322" y="34">H</text><text x="322" y="124">H</text><text x="514" y="34">H</text><text x="514" y="124">H</text><text x="606" y="81">H</text><text x="814" y="81">H</text></g>
      </g>
      <g font-family="Nunito,sans-serif" font-weight="800" font-size="18" text-anchor="middle" fill="#F1F5F7"><text x="110" y="164">Etano, C<tspan dy="5" font-size="13">2</tspan><tspan dy="-5">H</tspan><tspan dy="5" font-size="13">6</tspan></text><text x="418" y="164">Eteno, C<tspan dy="5" font-size="13">2</tspan><tspan dy="-5">H</tspan><tspan dy="5" font-size="13">4</tspan></text><text x="710" y="164">Etino, C<tspan dy="5" font-size="13">2</tspan><tspan dy="-5">H</tspan><tspan dy="5" font-size="13">2</tspan></text></g>
    </svg>
    <div class="card step"><h3>Etino, C<sub>2</sub>H<sub>2</sub>: el acetileno</h3><p style="margin:0">Es el gas de los sopletes de soldadura. Junto con oxígeno, su llama pasa de 3000 °C y corta acero. Se guarda en cilindros especiales porque a presión puede explotar.</p></div>
    <div class="clave step"><b>Regla rápida.</b> Con el mismo número de carbonos, cada enlace extra quita 2 hidrógenos: 6, 4, 2.</div>
  </div>
</section>

<section data-titulo="7. Nombrar y cuidarse">
  <div class="inner">
    <h2>7. Cómo nombrar, y por qué no se mezclan con agua</h2>
    <div class="pasos">
      <div class="step"><span class="n">1</span><b>Cuenta carbonos</b>C<sub>5</sub>H<sub>10</sub> tiene 5: pent-.</div>
      <div class="step"><span class="n">2</span><b>Calcula 2n</b>2 × 5 = 10, igual que sus hidrógenos.</div>
      <div class="step"><span class="n">3</span><b>Elige la familia</b>En cadena abierta, 2n + 2 es alcano, 2n es alqueno, 2n − 2 es alquino.</div>
      <div class="step"><span class="n">4</span><b>Une las partes</b>pent + eno = penteno.</div>
    </div>
    <div class="grid2 step">
      <div class="card"><h3>Propiedades</h3><p style="margin:0">Son moléculas no polares: no se disuelven en agua y flotan sobre ella, como la gasolina en un charco. Los alcanos de 1 a 4 carbonos son gases, los siguientes son líquidos y los muy largos son sólidos, como la parafina.</p></div>
      <div class="card"><h3>Peligro</h3><p style="margin:0">Todos arden. Una fuga de gas en un cuarto cerrado puede explotar con una chispa. El gas de cocina casi no huele: le añaden una sustancia de olor fuerte para que notes la fuga. Si hueles gas, abre puertas y ventanas, y no prendas nada.</p></div>
    </div>
    <div class="clave step"><b>Pregunta para el chat:</b> ¿cómo se llama el C<sub>3</sub>H<sub>4</sub>? Tres carbonos: prop-. Como 2 × 3 − 2 = 4, es alquino. Se llama propino.</div>
  </div>
</section>
