<template id="laminas">
<section data-titulo="1. El anillo del benceno">
  <div class="inner">
    <h2>1. El anillo del benceno</h2>
    <p>La clase pasada los carbonos formaban cadenas abiertas. También pueden cerrarse en un anillo. El más famoso es el benceno, <span class="f">C<sub>6</sub>H<sub>6</sub></span>: seis carbonos en un hexágono, cada uno con un hidrógeno.</p>
    <svg class="dib" viewBox="0 0 760 210" role="img" aria-label="El benceno dibujado con sus seis carbonos y seis hidrógenos, y a la derecha la forma corta: un hexágono con un círculo adentro" style="max-width:680px;margin:0 auto">
      <g fill="none" stroke="#A9BCC4" stroke-width="3"><path d="M190 42l57 33v66l-57 33-57-33V75z"/><circle cx="190" cy="108" r="36" stroke="#FFC800"/><path d="M190 42V24M247 75l15-9M247 141l15 9M190 174v18M133 141l-15 9M133 75l-15-9"/></g>
      <g fill="none" stroke="#A9BCC4" stroke-width="4"><path d="M570 42l57 33v66l-57 33-57-33V75z"/><circle cx="570" cy="108" r="36" stroke="#FFC800"/></g>
      <g font-family="Nunito,sans-serif" font-weight="900" font-size="19" text-anchor="middle">
        <g fill="#3BC97A" stroke="#131F24" stroke-width="7" paint-order="stroke"><text x="190" y="49">C</text><text x="247" y="82">C</text><text x="247" y="148">C</text><text x="190" y="181">C</text><text x="133" y="148">C</text><text x="133" y="82">C</text></g>
        <g fill="#FFC800"><text x="190" y="20">H</text><text x="274" y="66">H</text><text x="274" y="164">H</text><text x="190" y="208">H</text><text x="106" y="164">H</text><text x="106" y="66">H</text></g>
      </g>
      <g font-family="Nunito,sans-serif" font-weight="800" font-size="18" text-anchor="middle" fill="#F1F5F7"><text x="380" y="100">Se dibuja</text><text x="380" y="124">más corto</text></g>
      <path d="M340 140h78" stroke="#A9BCC4" stroke-width="3"/><path d="M430 140l-13-7v14z" fill="#A9BCC4"/>
    </svg>
    <div class="clave step"><b>¿Qué significa el círculo?</b> Los tres enlaces dobles del anillo no se quedan quietos en un sitio: sus electrones se reparten por todo el anillo. Por eso el benceno es muy estable. A esta familia se le llama <b>aromática</b>, porque los primeros que se conocieron tenían olor fuerte.</div>
  </div>
</section>

<section data-titulo="2. Útil y peligroso">
  <div class="inner">
    <h2>2. Útil en la fábrica, peligroso en la casa</h2>
    <p>El benceno sale del petróleo. La industria lo usa como materia prima de plásticos, colorantes y medicinas. Si al anillo le cambias un hidrógeno por otro grupo, aparece un compuesto nuevo.</p>
    <table class="t">
      <tr><th>Nombre</th><th>Fórmula</th><th>Dónde está</th><th>Cuidado</th></tr>
      <tr><td>Benceno</td><td>C<sub>6</sub>H<sub>6</sub></td><td>Petróleo, gasolina en poca cantidad, humo de cigarrillo</td><td>Causa cáncer, sobre todo leucemia</td></tr>
      <tr><td>Metilbenceno o tolueno</td><td>C<sub>6</sub>H<sub>5</sub>CH<sub>3</sub></td><td>Thinner, pinturas y pegamentos</td><td>Inhalarlo daña el sistema nervioso</td></tr>
      <tr><td>Naftaleno</td><td>C<sub>10</sub>H<sub>8</sub></td><td>Bolas de naftalina</td><td>Tóxico si se come o se respira mucho</td></tr>
    </table>
    <div class="clave step"><b>Advertencia.</b> El benceno es cancerígeno comprobado, y por eso dejó de usarse como solvente de limpieza. No se usa en casa ni en laboratorios escolares.</div>
    <div class="clave step"><b>Pregunta para el chat:</b> el naftaleno tiene dos anillos pegados. ¿Sigue siendo un hidrocarburo? Sí, porque solo tiene carbono e hidrógeno.</div>
  </div>
</section>

<section data-titulo="3. El grupo OH">
  <div class="inner">
    <h2>3. Un grupo cambia todo: el OH</h2>
    <p>Un <b>grupo funcional</b> es un grupo de átomos que le da a la molécula su forma de comportarse. Si en un alcano cambias un hidrógeno por un grupo OH, obtienes un <b>alcohol</b>.</p>
    <svg class="dib" viewBox="0 0 760 150" role="img" aria-label="El etano tiene un hidrógeno que se reemplaza por un grupo OH, y así se forma el etanol" style="max-width:700px;margin:0 auto">
      <g stroke="#A9BCC4" stroke-width="3"><path d="M34 62h26M84 62h52M160 62h26M72 18v30M148 18v30M72 76v30M148 76v30"/><path d="M464 62h26M514 62h52M590 62h30M502 18v30M578 18v30M502 76v30M578 76v30"/></g>
      <g font-family="Nunito,sans-serif" font-weight="900" font-size="23" text-anchor="middle">
        <g fill="#3BC97A"><text x="72" y="71">C</text><text x="148" y="71">C</text><text x="502" y="71">C</text><text x="578" y="71">C</text></g>
        <g fill="#FFC800"><text x="22" y="71">H</text><text x="72" y="14">H</text><text x="148" y="14">H</text><text x="72" y="128">H</text><text x="148" y="128">H</text><text x="452" y="71">H</text><text x="502" y="14">H</text><text x="578" y="14">H</text><text x="502" y="128">H</text><text x="578" y="128">H</text></g>
        <text x="198" y="71" fill="#FF6B6B">H</text><text x="646" y="71" fill="#FF6B6B">OH</text>
      </g>
      <path d="M260 62h120" stroke="#A9BCC4" stroke-width="3"/><path d="M394 62l-14-8v16z" fill="#A9BCC4"/>
      <text x="320" y="48" font-family="Nunito,sans-serif" font-weight="800" font-size="16" text-anchor="middle" fill="#A9BCC4">cambia H por OH</text>
      <g font-family="Nunito,sans-serif" font-weight="800" font-size="18" text-anchor="middle" fill="#F1F5F7"><text x="110" y="148">Etano: un gas</text><text x="550" y="148">Etanol: un líquido</text></g>
    </svg>
    <div class="clave step"><b>Trampa.</b> El OH de un alcohol no es el OH<sup>−</sup> de una base. En el NaOH está como ion y se suelta en el agua. En el alcohol está unido con enlace covalente y no se suelta. Por eso el alcohol <b>no</b> es una base: su pH es cercano a 7.</div>
    <div class="clave step"><b>Por qué se mezcla con agua.</b> El OH es polar y forma puentes de hidrógeno con el agua. Por eso el etanol se disuelve en agua y el etano no.</div>
  </div>
</section>

<section data-titulo="4. Nombrar alcoholes">
  <div class="inner">
    <h2>4. Cómo se nombran los alcoholes</h2>
    <p>Tomas el nombre del alcano y cambias la <b>o</b> final por <span class="f">-ol</span>. Metano da metanol. Etano da etanol. Cuando importa dónde está el OH, se indica con un número.</p>
    <table class="t">
      <tr><th>Nombre actual</th><th>Nombre común</th><th>Fórmula</th><th>Uso</th></tr>
      <tr><td>Metanol</td><td>Alcohol de madera</td><td>CH<sub>3</sub>OH</td><td>Solvente y combustible industrial</td></tr>
      <tr><td>Etanol</td><td>Alcohol etílico</td><td>CH<sub>3</sub>CH<sub>2</sub>OH</td><td>Bebidas, antiséptico, gasolina Ecopaís</td></tr>
      <tr><td>Propan-2-ol</td><td>Alcohol isopropílico</td><td>CH<sub>3</sub>CHOHCH<sub>3</sub></td><td>Limpiar equipos electrónicos, antiséptico</td></tr>
      <tr><td>Etano-1,2-diol</td><td>Etilenglicol</td><td>HOCH<sub>2</sub>CH<sub>2</sub>OH</td><td>Refrigerante de carros. Es tóxico</td></tr>
      <tr><td>Propano-1,2,3-triol</td><td>Glicerina</td><td>HOCH<sub>2</sub>CHOHCH<sub>2</sub>OH</td><td>Cremas y jabones: guarda humedad</td></tr>
    </table>
    <div class="clave step"><b>Pregunta para el chat:</b> ¿cómo se llama el alcohol que sale del butano? Butanol. Si la molécula tiene dos OH es un diol, y si tiene tres es un triol.</div>
  </div>
</section>

<section data-titulo="5. Metanol y etanol">
  <div class="inner">
    <h2>5. Metanol y etanol: casi iguales, pero uno mata</h2>
    <div class="grid2">
      <div class="card"><h3>Metanol</h3><p style="margin:0">Huele y se ve casi igual que el etanol. Tu cuerpo lo transforma en sustancias que dañan el nervio del ojo. Unas pocas cucharadas pueden causar ceguera o la muerte.</p></div>
      <div class="card"><h3>Etanol</h3><p style="margin:0">Es el de las bebidas. También es tóxico y en exceso puede matar. Al 70 % en agua sirve como antiséptico. En las etiquetas, 40 % significa 40 mL de etanol en cada 100 mL.</p></div>
    </div>
    <div class="clave"><b>Peligro real.</b> En varios países, también en Ecuador, ha muerto gente por tomar licor adulterado con metanol. Nunca consumas licor sin registro sanitario ni alcohol industrial.</div>
    <div class="grid2 step">
      <div class="card"><h3>Ejemplo 1</h3><p style="margin:0">¿Cuánto etanol tiene una botella de 750 mL al 40 %? 750 mL × 40 ÷ 100 = <b>300 mL</b>.</p></div>
      <div class="card"><h3>Ejemplo 2</h3><p style="margin:0">¿Cuánto alcohol al 96 % hace falta para 480 mL al 70 %? Como en la dilución, concentración por volumen no cambia: 70 × 480 ÷ 96 = <b>350 mL</b>, y se completa con agua hasta 480 mL.</p></div>
    </div>
  </div>
</section>

<section data-titulo="6. Fenoles">
  <div class="inner">
    <h2>6. Fenoles: el OH pegado al anillo</h2>
    <p>Si el grupo OH se une directamente a un anillo de benceno, ya no hablamos de un alcohol común sino de un <b>fenol</b>. El más simple se llama fenol y su fórmula es <span class="f">C<sub>6</sub>H<sub>5</sub>OH</span>.</p>
    <svg class="dib" viewBox="0 0 640 186" role="img" aria-label="El benceno con un OH unido directamente al anillo forma el fenol" style="max-width:560px;margin:0 auto">
      <g fill="none" stroke="#A9BCC4" stroke-width="3.5"><path d="M110 12l52 30v60l-52 30-52-30V42z"/><circle cx="110" cy="72" r="31" stroke="#FFC800"/><path d="M450 12l52 30v60l-52 30-52-30V42z"/><circle cx="450" cy="72" r="31" stroke="#FFC800"/><path d="M502 102l38 22"/></g>
      <path d="M210 72h110" stroke="#A9BCC4" stroke-width="3"/><path d="M334 72l-14-8v16z" fill="#A9BCC4"/>
      <text x="265" y="58" font-family="Nunito,sans-serif" font-weight="800" font-size="16" text-anchor="middle" fill="#A9BCC4">un H por OH</text>
      <g font-family="Nunito,sans-serif" font-weight="900" text-anchor="middle"><text x="564" y="140" font-size="24" fill="#FF6B6B">OH</text><text x="110" y="172" font-size="19" fill="#F1F5F7">Benceno</text><text x="450" y="172" font-size="19" fill="#F1F5F7">Fenol</text></g>
    </svg>
    <div class="grid3 step">
      <div class="card"><h3>Desinfectar</h3><p style="margin:0">Lister usó fenol para limpiar quirófanos. Hoy, productos como la creolina contienen fenoles.</p></div>
      <div class="card"><h3>En plantas</h3><p style="margin:0">El eugenol da su olor al clavo de olor. El timol sale del tomillo y se usa en enjuagues bucales.</p></div>
      <div class="card"><h3>Peligro</h3><p style="margin:0">El fenol puro quema la piel y es tóxico. Se maneja solo con guantes y en laboratorio.</p></div>
    </div>
  </div>
</section>

<section data-titulo="7. Éteres">
  <div class="inner">
    <h2>7. Éteres: el oxígeno en medio</h2>
    <p>En un éter, un átomo de oxígeno está entre dos grupos de carbono: <span class="f">R−O−R</span>. La letra R significa «una cadena de carbonos». Se nombra con la cadena corta en -oxi y luego la otra: metoxi + metano. Mira esta sorpresa: etanol y metoximetano tienen la misma fórmula molecular, pero son sustancias distintas.</p>
    <svg class="dib" viewBox="0 0 860 130" role="img" aria-label="El etanol y el metoximetano tienen la fórmula C2H6O. En el etanol el oxígeno está en la punta con un hidrógeno, y en el éter está entre los dos carbonos" style="max-width:780px;margin:0 auto">
      <g font-family="Nunito,sans-serif" font-weight="900" font-size="27" text-anchor="middle" fill="#F1F5F7">
        <text x="210" y="54">CH<tspan dy="7" font-size="18">3</tspan><tspan dy="-7"> − CH</tspan><tspan dy="7" font-size="18">2</tspan><tspan dy="-7"> − </tspan><tspan fill="#FF6B6B">OH</tspan></text>
        <text x="650" y="54">CH<tspan dy="7" font-size="18">3</tspan><tspan dy="-7"> − </tspan><tspan fill="#FF6B6B">O</tspan><tspan> − CH</tspan><tspan dy="7" font-size="18">3</tspan></text>
      </g>
      <g font-family="Nunito,sans-serif" font-weight="800" font-size="18" text-anchor="middle"><text x="210" y="92" fill="#3BC97A">Etanol, un alcohol: C<tspan dy="5" font-size="13">2</tspan><tspan dy="-5">H</tspan><tspan dy="5" font-size="13">6</tspan><tspan dy="-5">O</tspan></text><text x="650" y="92" fill="#3BC97A">Metoximetano, un éter: C<tspan dy="5" font-size="13">2</tspan><tspan dy="-5">H</tspan><tspan dy="5" font-size="13">6</tspan><tspan dy="-5">O</tspan></text>
        <text x="210" y="120" fill="#A9BCC4">Hierve a 78 °C: es líquido</text><text x="650" y="120" fill="#A9BCC4">Hierve a −24 °C: es gas</text></g>
    </svg>
    <div class="grid2 step">
      <div class="card"><h3>¿Por qué tanta diferencia?</h3><p style="margin:0">A temperatura ambiente uno es líquido y el otro es gas. El etanol tiene OH y forma puentes de hidrógeno entre sus moléculas. El éter no tiene OH, así que sus moléculas se separan con facilidad.</p></div>
      <div class="card"><h3>Etoxietano o éter dietílico</h3><p style="margin:0">Es CH<sub>3</sub>CH<sub>2</sub>−O−CH<sub>2</sub>CH<sub>3</sub>. Fue uno de los primeros anestésicos y sigue siendo solvente de laboratorio. Sus vapores arden con mucha facilidad.</p></div>
    </div>
  </div>
</section>
</template>
