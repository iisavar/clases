<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conversiones de unidades</title>
<meta name="description" content="Cómo pasar una medida de una unidad a otra con el factor unitario, con un duelo y un juego para el celular.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
<div class="deck" id="deck"></div>

<template id="laminas">
<section data-titulo="1. La misma cantidad, otro número">
  <div class="inner">
    <h2>1. La misma cantidad, otro número</h2>
    <p>La pastilla dice 500 mg y el médico dice «medio gramo». El corredor hizo 5 km y el reloj marca 5000 m. El vaso tiene 250 mL y la receta pide 0,25 L. En cada caso se habla de lo mismo.</p>
    <div class="grid3">
      <div class="card"><h3>En la farmacia</h3><p style="margin:0">500 mg = 0,5 g</p></div>
      <div class="card"><h3>En la cancha</h3><p style="margin:0">5 km = 5000 m</p></div>
      <div class="card"><h3>En la cocina</h3><p style="margin:0">250 mL = 0,25 L</p></div>
    </div>
    <div class="clave step"><b>Convertir no cambia la cantidad.</b> Solo cambia la forma de escribirla. La pastilla no se hace más grande porque la escribas en miligramos.</div>
    <div class="clave step"><b>Pregunta para el chat:</b> si la unidad se hace más pequeña, ¿el número sube o baja? Sube. Se necesitan más unidades pequeñas para llenar lo mismo: 1 km son 1000 m.</div>
  </div>
</section>

<section data-titulo="2. El factor unitario">
  <div class="inner">
    <h2>2. El factor unitario: una fracción que vale 1</h2>
    <p>Sabemos que 1 km y 1000 m son la misma longitud. Si pones esas dos cosas en una fracción, arriba y abajo hay lo mismo. Y todo número dividido para sí mismo da 1.</p>
    <svg class="dib" viewBox="0 0 640 170" role="img" aria-label="Una balanza equilibrada con 1 kilómetro en un plato y 1000 metros en el otro, y las dos fracciones que salen de esa igualdad, ambas iguales a 1" style="max-width:640px;margin:0 auto">
      <path d="M140 150l-22 0 22-96 22 96z" fill="#2E4652"/><path d="M40 54h200" stroke="#A9BCC4" stroke-width="5" stroke-linecap="round"/>
      <g fill="none" stroke="#A9BCC4" stroke-width="2"><path d="M44 54l-26 44M44 54l26 44M236 54l-26 44M236 54l26 44"/></g>
      <g fill="#22363F" stroke="#3BC97A" stroke-width="2"><rect x="10" y="98" width="68" height="36" rx="8"/><rect x="196" y="98" width="80" height="36" rx="8"/></g>
      <g fill="#F1F5F7" font-family="Nunito,sans-serif" font-size="17" font-weight="800" text-anchor="middle"><text x="44" y="122">1 km</text><text x="236" y="122">1000 m</text></g>
      <g font-family="Nunito,sans-serif" font-size="22" font-weight="800" text-anchor="middle">
        <g fill="#F1F5F7"><text x="376" y="66">1000 m</text><text x="376" y="110">1 km</text><text x="540" y="66">1 km</text><text x="540" y="110">1000 m</text></g>
        <path d="M326 78h100M490 78h100" stroke="#F1F5F7" stroke-width="2.5"/>
        <g fill="#FFC800" font-weight="900"><text x="454" y="86">= 1</text><text x="618" y="86">= 1</text></g>
      </g>
      <text x="470" y="146" fill="#A9BCC4" font-family="Nunito,sans-serif" font-size="15" font-weight="800" text-anchor="middle">Las dos valen 1: elegimos la que nos sirva</text>
    </svg>
    <div class="clave step"><b>Un factor unitario</b> es una fracción con la misma cantidad arriba y abajo, escrita en unidades distintas. Vale 1.</div>
    <div class="clave step"><b>¿Por qué sirve?</b> Multiplicar por 1 no cambia nada. La cantidad queda igual, pero la unidad sí cambia.</div>
  </div>
</section>

<section data-titulo="3. Cómo elegir el factor">
  <div class="inner">
    <h2>3. Cómo elegir el factor: lo que quieres va arriba</h2>
    <p>La unidad que quieres quitar va abajo, para que se cancele. La unidad que quieres obtener va arriba. Una unidad arriba y la misma abajo se tachan, igual que los números en una fracción.</p>
    <div class="grid2">
      <div class="card"><h3>De kilómetros a metros</h3>
        <svg class="dib" viewBox="0 0 440 96" role="img" aria-label="2,5 kilómetros por 1000 metros sobre 1 kilómetro da 2500 metros; los kilómetros se tachan">
          <g fill="#F1F5F7" font-family="Nunito,sans-serif" font-size="21" font-weight="800" text-anchor="middle">
            <text x="38" y="56">2,5</text><text x="84" y="56">km</text><text x="122" y="56">×</text>
            <text x="200" y="34">1000 m</text><text x="182" y="80">1</text><text x="212" y="80">km</text>
            <text x="276" y="56">=</text></g>
          <path d="M150 49h100" stroke="#F1F5F7" stroke-width="2.5"/>
          <path d="M66 58l36-16M194 82l36-16" stroke="#FF6B6B" stroke-width="3"/>
          <text x="360" y="57" fill="#FFC800" font-family="Nunito,sans-serif" font-size="24" font-weight="900" text-anchor="middle">2500 m</text>
        </svg></div>
      <div class="card step"><h3>De miligramos a gramos</h3>
        <svg class="dib" viewBox="0 0 440 96" role="img" aria-label="250 miligramos por 1 gramo sobre 1000 miligramos da 0,25 gramos; los miligramos se tachan">
          <g fill="#F1F5F7" font-family="Nunito,sans-serif" font-size="21" font-weight="800" text-anchor="middle">
            <text x="38" y="56">250</text><text x="90" y="56">mg</text><text x="128" y="56">×</text>
            <text x="205" y="34">1 g</text><text x="183" y="80">1000</text><text x="234" y="80">mg</text>
            <text x="288" y="56">=</text></g>
          <path d="M150 49h110" stroke="#F1F5F7" stroke-width="2.5"/>
          <path d="M72 58l36-16M216 82l36-16" stroke="#FF6B6B" stroke-width="3"/>
          <text x="366" y="57" fill="#FFC800" font-family="Nunito,sans-serif" font-size="24" font-weight="900" text-anchor="middle">0,25 g</text>
        </svg></div>
    </div>
    <div class="pasos step" style="grid-template-columns:repeat(3,1fr)">
      <div><span class="n">1</span><b>Escribe el dato</b>Con su número y su unidad.</div>
      <div><span class="n">2</span><b>Pon el factor</b>Lo que quieres arriba y lo que quitas abajo.</div>
      <div><span class="n">3</span><b>Tacha y calcula</b>Multiplica arriba y divide para lo de abajo.</div>
    </div>
    <div class="clave step"><b>Si la unidad que querías quitar no se tacha,</b> pusiste el factor al revés. Dale la vuelta.</div>
  </div>
</section>

<section data-titulo="4. Factores en cadena">
  <div class="inner">
    <h2>4. Factores en cadena: de km/h a m/s</h2>
    <p>A veces hay que cambiar dos unidades. No pasa nada: se usa un factor para cada una, uno detrás de otro. Un carro va a 90 km/h por la carretera. ¿Cuántos metros avanza en un segundo?</p>
    <svg class="dib" viewBox="0 0 640 100" role="img" aria-label="90 kilómetros sobre 1 hora, por 1000 metros sobre 1 kilómetro, por 1 hora sobre 3600 segundos, da 25 metros por segundo; se tachan los kilómetros y las horas" style="max-width:800px;margin:0 auto">
      <g fill="#F1F5F7" font-family="Nunito,sans-serif" font-size="21" font-weight="800" text-anchor="middle">
        <text x="48" y="34">90</text><text x="92" y="34">km</text><text x="54" y="82">1</text><text x="84" y="82">h</text>
        <text x="142" y="58">×</text>
        <text x="226" y="34">1000 m</text><text x="206" y="82">1</text><text x="240" y="82">km</text>
        <text x="306" y="58">×</text>
        <text x="372" y="34">1</text><text x="402" y="34">h</text><text x="388" y="82">3600 s</text>
        <text x="472" y="58">=</text></g>
      <path d="M26 51h94M176 51h100M338 51h100" stroke="#F1F5F7" stroke-width="2.5"/>
      <path d="M74 36l36-16M72 84l24-16M222 84l36-16M390 36l24-16" stroke="#FF6B6B" stroke-width="3"/>
      <text x="556" y="59" fill="#FFC800" font-family="Nunito,sans-serif" font-size="24" font-weight="900" text-anchor="middle">25 m/s</text>
    </svg>
    <div class="ejemplo step"><b>La cuenta:</b> 90 × 1000 = 90 000 arriba, y 1 × 1 × 3600 = 3600 abajo. Luego 90 000 ÷ 3600 = 25. El carro avanza 25 metros cada segundo.</div>
    <div class="clave step"><b>Cada factor quita una unidad.</b> El primero quita los kilómetros y el segundo quita las horas.</div>
    <div class="clave step"><b>Pregunta para el chat:</b> ¿cuántos segundos tiene un día? 1 día × 24 h/día × 3600 s/h = 86 400 s.</div>
  </div>
</section>

<section data-titulo="5. Volumen: litros y centímetros cúbicos">
  <div class="inner">
    <h2>5. Volumen: el litro y el centímetro cúbico</h2>
    <div class="grid2">
      <div>
        <p>Imagina una caja cúbica de 10 cm de lado. Tiene 10 × 10 × 10 = 1000 cm<sup>3</sup>. Esa caja llena de agua es exactamente un litro.</p>
        <p>Y un cubito de 1 cm de lado guarda un mililitro. Por eso 1 mL y 1 cm<sup>3</sup> son lo mismo. En la farmacia a veces lo escriben cc: una jeringa de 5 cc tiene 5 mL.</p>
        <div class="card step"><h3>Ejemplo: una botella de 0,75 L</h3><p style="margin:0">0,75 L × (1000 mL / 1 L) = <span class="f">750 mL</span></p></div>
      </div>
      <svg class="dib" viewBox="0 0 400 300" role="img" aria-label="Un cubo de 10 centímetros de lado que contiene 1 litro, con un cubito de 1 centímetro de lado en una esquina que contiene 1 mililitro" style="max-width:440px;margin:0 auto">
        <path d="M60 90h200v200h-200z" fill="#4FB3E8" opacity=".22"/><path d="M60 90l70-60h200l-70 60z" fill="#4FB3E8" opacity=".35"/><path d="M260 90l70-60v200l-70 60z" fill="#4FB3E8" opacity=".12"/>
        <g fill="none" stroke="#4FB3E8" stroke-width="2.5"><path d="M60 90h200v200h-200z"/><path d="M60 90l70-60h200l-70 60"/><path d="M260 290l70-60v-200"/></g>
        <path d="M60 270h20v20h-20z" fill="#FFC800"/>
        <g fill="#F1F5F7" font-family="Nunito,sans-serif" font-size="18" font-weight="800"><text x="160" y="150" text-anchor="middle">1 L</text><text x="160" y="176" text-anchor="middle">1000 mL</text><text x="160" y="202" text-anchor="middle">1000 cm³</text><text x="344" y="140">10</text><text x="344" y="162">cm</text></g>
        <text x="90" y="284" fill="#FFC800" font-family="Nunito,sans-serif" font-size="15" font-weight="900">1 cm³ = 1 mL</text>
        <text x="160" y="24" fill="#A9BCC4" font-family="Nunito,sans-serif" font-size="14" font-weight="800" text-anchor="middle">No es a escala</text>
      </svg>
    </div>
    <div class="clave step"><b>Para memorizar:</b> 1 L = 1000 mL = 1000 cm<sup>3</sup>, y también 1 L = 1 dm<sup>3</sup>.</div>
  </div>
</section>

<section data-titulo="6. Unidades al cuadrado y al cubo">
  <div class="inner">
    <h2>6. Unidades al cuadrado y al cubo</h2>
    <p>Aquí está la trampa más común. Un metro son 100 cm, pero un metro cuadrado no son 100 cm<sup>2</sup>. Mira el dibujo: el cuadrado tiene 100 cm de cada lado, así que el factor se usa dos veces.</p>
    <div class="grid2">
      <svg class="dib" viewBox="0 0 400 236" role="img" aria-label="Un cuadrado de 1 metro de lado, o 100 centímetros de lado, cuadriculado: tiene 100 por 100 centímetros cuadrados, es decir 10 000" style="max-width:400px;margin:0 auto">
        <rect x="90" y="14" width="170" height="170" fill="#2BAE66" opacity=".18"/>
        <g stroke="#3BC97A" stroke-width="1"><path d="M107 14v170M124 14v170M141 14v170M158 14v170M175 14v170M192 14v170M209 14v170M226 14v170M243 14v170M90 31h170M90 48h170M90 65h170M90 82h170M90 99h170M90 116h170M90 133h170M90 150h170M90 167h170"/></g>
        <rect x="90" y="14" width="170" height="170" fill="none" stroke="#3BC97A" stroke-width="3"/>
        <g fill="#F1F5F7" font-family="Nunito,sans-serif" font-size="16" font-weight="800"><text x="175" y="206" text-anchor="middle">1 m = 100 cm</text><text x="175" y="228" text-anchor="middle" fill="#A9BCC4" font-size="14">Cada cuadrito del dibujo mide 10 cm × 10 cm</text><text x="76" y="94" text-anchor="end">1 m =</text><text x="76" y="114" text-anchor="end">100 cm</text></g>
        <text x="276" y="102" fill="#FFC800" font-family="Nunito,sans-serif" font-size="17" font-weight="900">1 m²</text>
      </svg>
      <div>
        <div class="card"><h3>Al cuadrado: dos veces</h3><p style="margin:0">1 m<sup>2</sup> = 100 cm × 100 cm = <span class="f">10 000 cm<sup>2</sup></span></p></div>
        <div class="card step" style="margin-top:12px"><h3>Al cubo: tres veces</h3><p style="margin:0">1 m<sup>3</sup> = 100 × 100 × 100 cm<sup>3</sup> = <span class="f">1 000 000 cm<sup>3</sup></span>, que son 1000 L.</p></div>
      </div>
    </div>
    <div class="ejemplo step"><b>Ejemplo:</b> una cisterna de 2 m<sup>3</sup> guarda 2 m<sup>3</sup> × (1000 L / 1 m<sup>3</sup>) = <span class="f">2000 L</span> de agua.</div>
    <div class="clave step"><b>Si una unidad de longitud lleva un 2 arriba, su factor va dos veces. Si lleva un 3, tres veces.</b> El factor 1000 L / 1 m<sup>3</sup> ya trae hecha esa cuenta.</div>
  </div>
</section>

<section data-titulo="7. Unidades de la vida diaria">
  <div class="inner">
    <h2>7. Las unidades de la vida diaria</h2>
    <p>En el mercado se compra por libras y en la gasolinera por galones. Esas unidades no son del SI, pero el método es el mismo: se usa la igualdad como factor.</p>
    <table class="t">
      <tr><th>Unidad</th><th>Equivale a</th><th>Dónde la ves</th></tr>
      <tr><td>1 libra (lb)</td><td>454 g, aproximadamente</td><td>Arroz, azúcar y carne en el mercado</td></tr>
      <tr><td>1 galón</td><td>3,785 L, aproximadamente</td><td>Gasolina y pintura</td></tr>
      <tr><td>1 pulgada</td><td>2,54 cm</td><td>Pantallas y tubos</td></tr>
    </table>
    <div class="grid2" style="margin-top:12px">
      <div class="ejemplo step" style="margin:0"><b>Un saco de 5 lb:</b><br>5 lb × (454 g / 1 lb) = 2270 g, es decir 2,27 kg.</div>
      <div class="ejemplo step" style="margin:0"><b>Un tanque de 12 galones:</b><br>12 galones × (3,785 L / 1 galón) = 45,42 L.</div>
    </div>
    <div class="clave step"><b>Revisa siempre si el resultado tiene sentido.</b> Si una botella de agua te sale con 500 L, algo está mal: casi seguro el factor quedó al revés.</div>
  </div>
</section>
</template>
