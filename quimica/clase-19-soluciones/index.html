<section data-titulo="1. Qué es una solución">
  <div class="inner">
    <h2>1. ¿Qué es una solución?</h2>
    <p>Echa una cucharada de sal en un vaso de agua y revuelve. La sal desaparece de la vista, pero sigue ahí: el agua sabe salada. Eso es una solución, una mezcla homogénea como las que vimos en la clase de mezclas.</p>
    <svg class="dib" viewBox="0 0 860 198" role="img" aria-label="Sal, el soluto, más agua, el solvente, forman una solución transparente con la sal repartida por todo el vaso" style="max-width:800px;margin:0 auto">

      <use href="#vaso19" x="335" y="20"/><rect x="337" y="50" width="106" height="90" rx="10" fill="#4FB3E8" opacity=".3"/>

      <g font-family="Nunito,sans-serif" font-weight="800" fill="#F1F5F7" font-size="20" text-anchor="middle"><text x="113" y="164">Sal</text><text x="390" y="164">Agua</text><text x="700" y="164">Agua salada</text></g>

    </svg>
    <div class="grid2 step">
      <div class="card"><h3>Soluto</h3><p style="margin:0">Lo que se disuelve. Suele estar en menor cantidad.</p></div>
      <div class="card"><h3>Solvente</h3><p style="margin:0">Lo que disuelve. Suele estar en mayor cantidad. El más común es el agua.</p></div>
    </div>
    <div class="clave step"><b>No todo es sólido en agua.</b> La gaseosa es un gas disuelto en un líquido. El aire es una solución de gases. El bronce es una solución de sólidos, de cobre y estaño.</div>
  </div>
</section>

<section data-titulo="2. Por qué algo se disuelve">
  <div class="inner">
    <h2>2. ¿Por qué unas cosas se disuelven y otras no?</h2>
    <p>En la clase de polaridad vimos que el agua es una molécula polar. Por eso rodea y separa a las sustancias polares y a los iones, como la sal y el azúcar. El aceite es apolar y el agua no lo puede separar.</p>
    <div class="clave"><b>Regla práctica:</b> lo semejante disuelve a lo semejante. Polar con polar, y apolar con apolar.</div>
    <table class="t step">
      <tr><th>Sustancia</th><th>¿Se disuelve en agua?</th><th>Por qué</th></tr>
      <tr><td>Sal de mesa</td><td>Sí</td><td>El agua separa sus iones</td></tr>
      <tr><td>Azúcar</td><td>Sí</td><td>Es polar, como el agua</td></tr>
      <tr><td>Aceite</td><td>No</td><td>Es apolar: flota y forma dos capas</td></tr>
    </table>
    <div class="clave step"><b>Pregunta para el chat:</b> ¿por qué una mancha de grasa sale con gasolina y no solo con agua? Porque la grasa y la gasolina son apolares.</div>
    <div class="ejemplo step"><b>Más rápido no es más cantidad.</b> Revolver, calentar o moler el soluto hace que se disuelva más rápido. Revolver y moler no aumentan el máximo que se puede disolver.</div>
  </div>
</section>

<section data-titulo="3. Solubilidad">
  <div class="inner">
    <h2>3. Solubilidad: el agua también se llena</h2>
    <p>Si sigues echando sal a un vaso de agua, llega un punto en que ya no se disuelve y se queda en el fondo. La <b>solubilidad</b> es la cantidad máxima de soluto que se disuelve en 100 g de agua a una temperatura dada. Para la sal, a 20 °C, son unos 36 g. Si aún admite más soluto, la solución está <b>insaturada</b>. Si ya tiene el máximo, está <b>saturada</b>.</p>
    <svg class="dib" viewBox="0 0 860 170" role="img" aria-label="Tres vasos con 100 gramos de agua a 20 grados. Con 20 gramos de sal está insaturada, con 36 gramos saturada y con 50 gramos saturada con 14 gramos en el fondo" style="max-width:800px;margin:0 auto">
      <defs><path id="v19b" d="M0 0v92a10 10 0 0 0 10 10h90a10 10 0 0 0 10-10V0" fill="none" stroke="#A9BCC4" stroke-width="3"/></defs>
      <g id="agua19"><use href="#v19b" x="90" y="8"/><rect x="92" y="28" width="106" height="80" rx="8" fill="#4FB3E8" opacity=".3"/></g>
      <use href="#agua19" x="285"/><use href="#agua19" x="570"/>
      <g fill="#F1F5F7"><circle cx="112" cy="50" r="3"/><circle cx="150" cy="44" r="3"/><circle cx="176" cy="66" r="3"/><circle cx="130" cy="84" r="3"/><circle cx="168" cy="92" r="3"/></g>
      <g fill="#F1F5F7"><circle cx="396" cy="44" r="3"/><circle cx="420" cy="52" r="3"/><circle cx="444" cy="42" r="3"/><circle cx="470" cy="50" r="3"/><circle cx="388" cy="66" r="3"/><circle cx="412" cy="74" r="3"/><circle cx="438" cy="66" r="3"/><circle cx="464" cy="74" r="3"/><circle cx="398" cy="92" r="3"/><circle cx="426" cy="94" r="3"/><circle cx="452" cy="90" r="3"/><circle cx="474" cy="96" r="3"/></g>
      <g fill="#F1F5F7"><circle cx="681" cy="42" r="3"/><circle cx="705" cy="50" r="3"/><circle cx="729" cy="40" r="3"/><circle cx="755" cy="48" r="3"/><circle cx="673" cy="62" r="3"/><circle cx="697" cy="68" r="3"/><circle cx="723" cy="62" r="3"/><circle cx="749" cy="70" r="3"/><circle cx="683" cy="82" r="3"/><circle cx="711" cy="84" r="3"/><circle cx="737" cy="82" r="3"/><circle cx="759" cy="86" r="3"/></g>
      <path d="M672 108c8-10 16-12 26-12s16 4 26 4 22-6 38 8z" fill="#F1F5F7"/>
      <g font-family="Nunito,sans-serif" font-weight="800" fill="#F1F5F7" font-size="19" text-anchor="middle"><text x="145" y="136">20 g de sal</text><text x="430" y="136">36 g de sal</text><text x="715" y="136">50 g de sal</text></g>
      <g font-family="Nunito,sans-serif" font-weight="900" fill="#FFC800" font-size="19" text-anchor="middle"><text x="145" y="162">Insaturada</text><text x="430" y="162">Saturada</text><text x="715" y="162">Saturada, 14 g al fondo</text></g>
    </svg>
    <div class="ejemplo step"><b>Ejemplo.</b> ¿Cuánta sal se disuelve como máximo en 200 g de agua a 20 °C?<br>Si 100 g de agua disuelven 36 g, 200 g disuelven el doble: <span class="f">72 g de sal</span>.</div>
    <div class="clave step"><b>La temperatura importa.</b> La mayoría de sólidos se disuelve mejor en caliente. Los gases, al revés: por eso una gaseosa caliente pierde el gas más rápido.</div>
  </div>
</section>

<section data-titulo="4. Porcentaje en masa">
  <div class="inner">
    <h2>4. Porcentaje en masa</h2>
    <p>Para decir cuánto soluto hay, usamos la concentración. La primera forma es el porcentaje en masa: cuántos gramos de soluto hay en cada 100 g de solución.</p>
    <div class="clave"><b>% m/m = (masa de soluto ÷ masa de solución) × 100</b><br>masa de solución = masa de soluto + masa de solvente</div>
    <svg class="dib" viewBox="0 0 860 100" role="img" aria-label="Barra de 100 gramos de solución dividida en 10 gramos de sal y 90 gramos de agua" style="max-width:760px;margin:0 auto">
      <rect x="10" y="12" width="84" height="46" fill="#FFC800"/><rect x="94" y="12" width="756" height="46" fill="#4FB3E8" opacity=".35"/><rect x="10" y="12" width="840" height="46" rx="4" fill="none" stroke="#A9BCC4" stroke-width="2"/>
      <g font-family="Nunito,sans-serif" font-weight="800" font-size="19" fill="#F1F5F7" text-anchor="middle"><text x="472" y="42">90 g de agua</text><text x="430" y="86">100 g de solución</text></g>
      <text x="52" y="42" font-family="Nunito,sans-serif" font-weight="900" font-size="19" fill="#0E1A1F" text-anchor="middle">10 g</text>
    </svg>
    <div class="ejemplo step"><b>Ejemplo.</b> Disuelves 25 g de azúcar en 225 g de agua.<br>Solución: 25 g + 225 g = 250 g<br>% m/m = (25 ÷ 250) × 100 = <span class="f">10 %</span></div>
    <div class="clave step"><b>El error más común:</b> dividir para el agua y no para la solución. 25 ÷ 225 da 11,1 %, y está mal.</div>
  </div>
</section>

<section data-titulo="5. Porcentaje masa en volumen">
  <div class="inner">
    <h2>5. Porcentaje masa en volumen</h2>
    <p>En la farmacia los líquidos se miden en mililitros. Por eso se usa el porcentaje masa en volumen: cuántos gramos de soluto hay en cada 100 mL de solución.</p>
    <div class="clave"><b>% m/v = (gramos de soluto ÷ mL de solución) × 100</b></div>
    <p>El suero fisiológico que ponen en el hospital dice «cloruro de sodio 0,9 %». Eso significa 0,9 g de sal en cada 100 mL de suero.</p>
    <div class="ejemplo step"><b>Ejemplo 1.</b> ¿Cuánta sal trae una funda de suero de 500 mL?<br>(0,9 g ÷ 100 mL) × 500 mL = <span class="f">4,5 g de sal</span></div>
    <div class="ejemplo step"><b>Ejemplo 2.</b> Se disuelven 8 g de azúcar hasta completar 200 mL de jarabe.<br>% m/v = (8 ÷ 200) × 100 = <span class="f">4 %</span></div>
    <div class="clave step"><b>Pregunta para el chat:</b> ¿cuánta sal hay en 1 000 mL del mismo suero? Son 9 g.</div>
  </div>
</section>

<section data-titulo="6. Porcentaje en volumen">
  <div class="inner">
    <h2>6. Porcentaje en volumen</h2>
    <p>Cuando soluto y solvente son líquidos, se comparan volúmenes. El alcohol antiséptico de 70 % tiene 70 mL de alcohol en cada 100 mL de solución.</p>
    <div class="clave"><b>% v/v = (mL de soluto ÷ mL de solución) × 100</b></div>
    <div class="ejemplo step"><b>Ejemplo 1.</b> ¿Cuántos mL de alcohol puro hay en un frasco de 500 mL al 70 %?<br>(70 ÷ 100) × 500 mL = <span class="f">350 mL de alcohol</span></div>
    <div class="ejemplo step"><b>Ejemplo 2.</b> Se mezclan alcohol y agua hasta tener 250 mL, con 50 mL de alcohol.<br>% v/v = (50 ÷ 250) × 100 = <span class="f">20 %</span></div>
    <table class="t step">
      <tr><th>Tipo</th><th>Compara</th><th>Se usa en</th></tr>
      <tr><td>% m/m</td><td>gramos con gramos</td><td>Soluciones que se pesan, como sal en agua</td></tr>
      <tr><td>% m/v</td><td>gramos con mL</td><td>Suero y medicinas líquidas</td></tr>
      <tr><td>% v/v</td><td>mL con mL</td><td>Alcohol antiséptico, bebidas</td></tr>
    </table>
  </div>
</section>

<section data-titulo="7. Preparar una solución">
  <div class="inner">
    <h2>7. Preparar una solución: despejar el soluto</h2>
    <p>Lo que más se hace en la práctica es el camino contrario: sabes qué solución quieres y debes calcular cuánto soluto y cuánto solvente pesar.</p>
    <div class="ejemplo step"><b>Quieres 200 g de agua salada al 5 % en masa.</b></div>
    <div class="pasos">
      <div class="step"><span class="n">1</span><b>Soluto</b>(5 ÷ 100) × 200 g = 10 g de sal</div>
      <div class="step"><span class="n">2</span><b>Solvente</b>200 g − 10 g = 190 g de agua</div>
      <div class="step"><span class="n">3</span><b>Comprobar</b>(10 ÷ 200) × 100 = <span class="f">5 %</span></div>
    </div>
    <div class="clave step"><b>Pregunta para el chat:</b> para 300 g de solución al 2 %, ¿cuánta sal y cuánta agua? Son 6 g de sal y 294 g de agua.</div>
    <div class="clave step"><b>Ojo:</b> si pones 10 g de sal en 200 g de agua, la solución pesa 210 g y ya no es 5 %. Da 4,8 %.</div>
  </div>
</section>
