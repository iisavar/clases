<section data-titulo="1. Ácidos y bases en tu casa">
  <div class="inner">
    <h2>1. Ácidos y bases en tu casa</h2>
    <p>Abre la cocina y el baño de tu casa. El limón y el vinagre son agrios. El jabón se siente resbaloso y la lejía limpia con fuerza. Parecen cosas sueltas, pero casi todas caben en dos familias: los ácidos y las bases.</p>
    <div class="grid2">
      <div class="card"><h3>Ácidos</h3><p style="margin:0">Tienen sabor agrio y atacan metales como el hierro y el zinc. Ejemplos: limón, vinagre, jugo gástrico y ácido de batería.</p></div>
      <div class="card"><h3>Bases</h3><p style="margin:0">Tienen sabor amargo y tacto resbaloso. Ejemplos: jabón, bicarbonato, amoniaco, lejía y destapacañerías.</p></div>
    </div>
    <div class="clave step"><b>Regla de seguridad.</b> Esas propiedades las conocemos por experiencia, no para que las pruebes. Nunca huelas de cerca, toques ni pruebes una sustancia para saber qué es. Los ácidos y las bases fuertes queman la piel.</div>
    <div class="clave step"><b>Pregunta para el chat:</b> ¿a qué familia pertenece el jugo de naranja? A los ácidos: es agrio y contiene ácido cítrico.</div>
  </div>
</section>

<section data-titulo="2. Qué hace ácido a un ácido">
  <div class="inner">
    <h2>2. ¿Qué hace ácido a un ácido?</h2>
    <p>Todo depende de lo que la sustancia suelta en el agua. Esta idea la propuso Arrhenius en 1884. Un ácido suelta iones H<sup>+</sup>. Una base suelta iones OH<sup>−</sup>.</p>

    <div class="clave step"><b>El caso del amoniaco.</b> El NH<sub>3</sub> no trae OH y aun así es base. Por eso hay una forma más amplia de decirlo: el ácido entrega un H<sup>+</sup> y la base lo recibe. El amoniaco toma un H<sup>+</sup> del agua y deja libre un OH<sup>−</sup>.</div>
  </div>
</section>

<section data-titulo="3. Fuerte no es concentrado">
  <div class="inner">
    <h2>3. Fuerte no es lo mismo que concentrado</h2>
    <p>Un ácido fuerte se separa casi por completo en el agua. Un ácido débil se separa muy poco: la mayoría de sus moléculas sigue entera.</p>
    <svg class="dib" viewBox="0 0 760 190" role="img" aria-label="Dos vasos. En el del ácido fuerte todos los iones están separados. En el del ácido débil casi todas las moléculas están enteras y solo una se separó" style="max-width:640px;margin:0 auto">

      <g fill="#2BAE66"><circle cx="155" cy="62" r="11"/><circle cx="225" cy="72" r="11"/><circle cx="118" cy="94" r="11"/><circle cx="190" cy="98" r="11"/><circle cx="262" cy="108" r="11"/><circle cx="170" cy="130" r="11"/></g>

      <g fill="#FFC800"><circle cx="520" cy="60" r="7"/><circle cx="605" cy="56" r="7"/><circle cx="530" cy="118" r="7"/><circle cx="615" cy="120" r="7"/><circle cx="655" cy="88" r="7"/><circle cx="582" cy="96" r="7"/></g>

  </div>
</section>

<section data-titulo="4. La escala de pH">
  <div class="inner">
    <h2>4. La escala de pH</h2>
    <p>El pH dice qué tan ácida o básica es una mezcla con agua. En la vida diaria va de 0 a 14. Los valores de esta regla son aproximados.</p>
    <svg class="dib" viewBox="0 0 1000 176" role="img" aria-label="Regla de pH de 0 a 14: ácido de batería 1, limón 2, vinagre 3, café 5, leche 6,5, agua pura 7, sangre 7,4, bicarbonato 8, jabón 10, amoniaco 11, lejía 13">

        <rect x="469.1" y="62" width="61.8" height="44" fill="#2BAE66"/>
        <rect x="530.9" y="62" width="61.3" height="44" fill="#4FB3E8" opacity=".25"/><rect x="592.2" y="62" width="61.3" height="44" fill="#4FB3E8" opacity=".38"/><rect x="653.5" y="62" width="61.3" height="44" fill="#4FB3E8" opacity=".5"/><rect x="714.8" y="62" width="61.3" height="44" fill="#4FB3E8" opacity=".65"/><rect x="776.1" y="62" width="61.3" height="44" fill="#4FB3E8" opacity=".8"/><rect x="837.4" y="62" width="61.3" height="44" fill="#4FB3E8" opacity=".9"/><rect x="898.7" y="62" width="61.3" height="44" fill="#4FB3E8"/>

    <div class="clave step"><b>Pregunta para el chat:</b> la sangre tiene pH 7,4. ¿Es ácida o básica? Ligeramente básica. Tu cuerpo la mantiene casi fija, porque un cambio pequeño ya es peligroso.</div>

<section data-titulo="5. Calcular el pH">
  <div class="inner">
    <h2>5. Calcular el pH</h2>
    <p>El pH sale de la concentración de H<sup>+</sup> en mol/L, que se escribe entre corchetes: <span class="f">pH = −log [H<sup>+</sup>]</span>. Si la concentración es una potencia de 10, el pH es el exponente sin el signo menos.</p>
    <div class="grid2">
      <div class="card"><h3>Ácido fuerte: HCl 0,01 mol/L</h3>
        <p class="step" style="margin:0 0 4px">1. Se separa todo: [H<sup>+</sup>] = 0,01 mol/L.</p>
        <p class="step" style="margin:0 0 4px">2. En potencia de 10: 0,01 = 10<sup>−2</sup>.</p>
        <p class="step" style="margin:0"><b>3. pH = 2.</b></p></div>
      <div class="card"><h3>Base fuerte: NaOH 0,001 mol/L</h3>
        <p class="step" style="margin:0 0 4px">1. [OH<sup>−</sup>] = 0,001 mol/L = 10<sup>−3</sup>.</p>
        <p class="step" style="margin:0 0 4px">2. El pOH es lo mismo con el OH<sup>−</sup>: pOH = 3.</p>
        <p class="step" style="margin:0"><b>3. A 25 °C, pH + pOH = 14, así que pH = 14 − 3 = 11.</b></p></div>
    </div>
    <div class="clave step"><b>Cada unidad de pH vale 10 veces.</b> Un pH 3 tiene 10 veces más H<sup>+</sup> que un pH 4, y 100 veces más que un pH 5. Por eso un cambio de dos unidades es enorme.</div>
  </div>
</section>

<section data-titulo="6. Neutralización">
  <div class="inner">
    <h2>6. Neutralización: el ácido y la base se cancelan</h2>
    <p>Cuando un ácido se junta con una base, el H<sup>+</sup> y el OH<sup>−</sup> forman agua. Lo que queda de cada uno forma una sal.</p>
    <div class="ejemplo" style="text-align:center"><b>ácido + base → sal + agua</b><br>HCl + NaOH → NaCl + H<sub>2</sub>O</div>
    <div class="card step"><h3>Ejemplo. ¿Cuántos mL de NaOH 0,20 mol/L neutralizan 50 mL de HCl 0,10 mol/L?</h3>
      <p style="margin:0 0 4px">1. Moles de ácido: 0,10 mol/L × 0,050 L = 0,0050 mol.</p>
      <p style="margin:0 0 4px">2. La ecuación es 1 a 1, entonces se necesitan 0,0050 mol de base.</p>
      <p style="margin:0">3. Volumen: 0,0050 mol ÷ 0,20 mol/L = 0,025 L = <b>25 mL</b>.</p></div>
    <div class="clave step"><b>En la vida diaria.</b> La leche de magnesia, Mg(OH)<sub>2</sub>, neutraliza el exceso de ácido del estómago. La cal corrige los suelos ácidos de una finca.</div>
  </div>
</section>

<section data-titulo="7. Saberlo sin probar">
  <div class="inner">
    <h2>7. ¿Cómo se sabe sin probarlo?</h2>
    <p>Un indicador es una sustancia que cambia de color según el pH. Se usa una cantidad pequeña y el color te dice si la muestra es ácida o básica.</p>
    <table class="t">
      <tr><th>Indicador</th><th>En ácido</th><th>En base</th></tr>
      <tr><td>Papel tornasol</td><td>Rojo</td><td>Azul</td></tr>
      <tr><td>Fenolftaleína</td><td>Incolora</td><td>Fucsia</td></tr>
      <tr><td>Jugo de col morada</td><td>Rojo o rosado</td><td>Verde o amarillo</td></tr>
    </table>
    <p style="margin-top:12px">Si necesitas el número exacto, se usa un medidor electrónico, el pH-metro. Así se controla el agua de una piscina.</p>
    <div class="clave step"><b>Pregunta para el chat:</b> pones jugo de col morada en vinagre. ¿Qué color esperas? Rojo o rosado, porque el vinagre es ácido. Puedes probarlo en casa.</div>
    <div class="clave step"><b>Peligro real.</b> Nunca mezcles cloro o lejía con limpiadores ácidos ni con amoniaco. Se libera un gas tóxico. La mezcla no limpia mejor: te enferma.</div>
  </div>
</section>
