<section data-titulo="1. Hidrácidos">
  <div class="inner">
    <h2>1. Hidrácidos: hidrógeno con un no metal</h2>
    <p>Son compuestos de hidrógeno con un no metal de los grupos 16 o 17, sin oxígeno. El hidrógeno tiene +1 y el no metal su número negativo. Como gases se nombran con <b>-uro de hidrógeno</b>. Disueltos en agua son ácidos, y su nombre termina en <b>-hídrico</b>.</p>
    <table class="t">
      <tr><th>Fórmula</th><th>Nombre como gas</th><th>Nombre en agua</th><th>Dónde lo ves</th></tr>
      <tr><td>HF</td><td>fluoruro de hidrógeno</td><td>ácido fluorhídrico</td><td>Graba el vidrio</td></tr>
      <tr><td>HCl</td><td>cloruro de hidrógeno</td><td>ácido clorhídrico</td><td>En tu estómago y en el ácido muriático</td></tr>
      <tr><td>HBr</td><td>bromuro de hidrógeno</td><td>ácido bromhídrico</td><td>Uso de laboratorio</td></tr>
      <tr><td>HI</td><td>yoduro de hidrógeno</td><td>ácido yodhídrico</td><td>Uso de laboratorio</td></tr>
      <tr><td>H<sub>2</sub>S</td><td>sulfuro de hidrógeno</td><td>ácido sulfhídrico</td><td>El olor a huevo podrido</td></tr>
    </table>
    <div class="clave step"><b>Cuidado con la palabra «haluro».</b> Haluro viene de halógeno, y se usa solo para el grupo 17. El HCl es un haluro de hidrógeno. El H<sub>2</sub>S no: el azufre es del grupo 16.</div>
    <div class="clave step"><b>Pregunta para el chat:</b> ¿por qué el H<sub>2</sub>S lleva dos hidrógenos? Porque el azufre tiene −2 y cada hidrógeno +1.</div>
  </div>
</section>

<section data-titulo="2. Oxoácidos">
  <div class="inner">
    <h2>2. Oxoácidos: un óxido de no metal con agua</h2>
    <p>La clase pasada dejamos pendiente este camino. Un óxido de no metal reacciona con agua y sale un ácido con hidrógeno, no metal y oxígeno. Se llama oxoácido. En libros viejos verás «oxiácido», y al óxido de partida lo llamarán «anhídrido».</p>
    <svg class="dib" viewBox="0 0 860 150" role="img" aria-label="El trióxido de azufre, con un azufre y tres oxígenos, más agua, con dos hidrógenos y un oxígeno, da ácido sulfúrico, con dos hidrógenos, un azufre y cuatro oxígenos" style="max-width:820px;margin:0 auto">
      <g fill="#FFC800"><circle cx="50" cy="50" r="22"/><circle cx="620" cy="50" r="22"/></g>
      <g fill="#FF6B6B"><circle cx="96" cy="50" r="20"/><circle cx="140" cy="50" r="20"/><circle cx="184" cy="50" r="20"/><circle cx="366" cy="50" r="20"/><circle cx="664" cy="50" r="20"/><circle cx="708" cy="50" r="20"/><circle cx="752" cy="50" r="20"/><circle cx="796" cy="50" r="20"/></g>
      <g fill="#4FB3E8"><circle cx="280" cy="50" r="16"/><circle cx="322" cy="50" r="16"/><circle cx="534" cy="50" r="16"/><circle cx="576" cy="50" r="16"/></g>
      <g fill="#0E1A1F" font-family="Nunito,sans-serif" font-size="18" font-weight="900" text-anchor="middle"><text x="50" y="56">S</text><text x="96" y="56">O</text><text x="140" y="56">O</text><text x="184" y="56">O</text><text x="280" y="56">H</text><text x="322" y="56">H</text><text x="366" y="56">O</text><text x="534" y="56">H</text><text x="576" y="56">H</text><text x="620" y="56">S</text><text x="664" y="56">O</text><text x="708" y="56">O</text><text x="752" y="56">O</text><text x="796" y="56">O</text></g>
      <text x="232" y="62" fill="#F1F5F7" font-family="Nunito,sans-serif" font-size="34" font-weight="900" text-anchor="middle">+</text>
      <path d="M410 50h76" stroke="#3BC97A" stroke-width="5"/><path d="M500 50l-18-9v18z" fill="#3BC97A"/>
      <g fill="#F1F5F7" font-family="Nunito,sans-serif" font-size="21" font-weight="900" text-anchor="middle"><text x="118" y="104">SO<tspan class="s" dy="5" font-size="15">3</tspan></text><text x="322" y="104">H<tspan class="s" dy="5" font-size="15">2</tspan><tspan dy="-5">O</tspan></text><text x="664" y="104">H<tspan class="s" dy="5" font-size="15">2</tspan><tspan dy="-5">SO</tspan><tspan class="s" dy="5" font-size="15">4</tspan></text></g>
      <g fill="#A9BCC4" font-family="Nunito,sans-serif" font-size="16" font-weight="800" text-anchor="middle"><text x="118" y="132">trióxido de azufre</text><text x="322" y="132">agua</text><text x="664" y="132">ácido sulfúrico</text></g>
    </svg>
    <div class="clave step"><b>La lluvia ácida es esto.</b> Los óxidos de azufre del humo de fábricas y carros se juntan con el agua de las nubes y forman ácidos.</div>
    <div class="clave step"><b>Pregunta para el chat:</b> el CO<sub>2</sub> con agua da H<sub>2</sub>CO<sub>3</sub>. ¿Dónde lo has tomado? En las gaseosas: es lo que les da ese picor.</div>
  </div>
</section>

<section data-titulo="3. Fórmula de un oxoácido">
  <div class="inner">
    <h2>3. Una regla rápida para escribir la fórmula</h2>
    <p>El no metal va en el medio, el hidrógeno adelante y el oxígeno al final. Primero decide cuántos hidrógenos lleva. Después calcula los oxígenos.</p>
    <table class="t">
      <tr><th>Número del no metal</th><th>Hidrógenos</th><th>Oxígenos</th><th>Ejemplo</th></tr>
      <tr><td>Impar: Cl, Br, I, N</td><td>1</td><td>(1 + número) ÷ 2</td><td>Cl +5: (1 + 5) ÷ 2 = 3, HClO<sub>3</sub></td></tr>
      <tr><td>Par: S, C</td><td>2</td><td>(2 + número) ÷ 2</td><td>S +4: (2 + 4) ÷ 2 = 3, H<sub>2</sub>SO<sub>3</sub></td></tr>
      <tr><td>P, As</td><td>3</td><td>(3 + número) ÷ 2</td><td>P +5: (3 + 5) ÷ 2 = 4, H<sub>3</sub>PO<sub>4</sub></td></tr>
    </table>
    <div class="ejemplo step">Comprueba siempre con la suma. H<sub>3</sub>PO<sub>4</sub>: 3(+1) + (+5) + 4(−2) = 0.</div>
    <div class="clave step"><b>El arsénico</b> trabaja aquí con +3 y +5, igual que el fósforo: H<sub>3</sub>AsO<sub>3</sub> y H<sub>3</sub>AsO<sub>4</sub>.</div>
    <div class="clave step"><b>Pregunta para el chat:</b> ¿qué fórmula tiene el oxoácido del nitrógeno con +5? Un hidrógeno, y (1 + 5) ÷ 2 = 3 oxígenos: HNO<sub>3</sub>.</div>
  </div>
</section>

<section data-titulo="4. Nombre de un oxoácido">
  <div class="inner">
    <h2>4. El nombre de un oxoácido</h2>
    <p style="margin-bottom:8px">La terminación dice el número del no metal: -oso menor, -ico mayor. El cloro suma hipo-…-oso y per-…-ico.</p>
    <table class="t" style="font-size:.84em">
      <tr><th>Fórmula</th><th>Nombre</th><th>Número</th></tr>
      <tr><td>HClO</td><td>ácido hipocloroso</td><td>Cl +1</td></tr>
      <tr><td>HClO<sub>2</sub></td><td>ácido cloroso</td><td>Cl +3</td></tr>
      <tr><td>HClO<sub>3</sub></td><td>ácido clórico</td><td>Cl +5</td></tr>
      <tr><td>HClO<sub>4</sub></td><td>ácido perclórico</td><td>Cl +7</td></tr>
      <tr><td>H<sub>2</sub>SO<sub>3</sub></td><td>ácido sulfuroso</td><td>S +4</td></tr>
      <tr><td>H<sub>2</sub>SO<sub>4</sub></td><td>ácido sulfúrico</td><td>S +6</td></tr>
      <tr><td>HNO<sub>3</sub></td><td>ácido nítrico</td><td>N +5</td></tr>
      <tr><td>H<sub>2</sub>CO<sub>3</sub></td><td>ácido carbónico</td><td>C +4</td></tr>
      <tr><td>H<sub>3</sub>PO<sub>4</sub></td><td>ácido fosfórico</td><td>P +5</td></tr>
      <tr><td>H<sub>3</sub>AsO<sub>3</sub></td><td>ácido arsenioso</td><td>As +3</td></tr>
    </table>
    <div class="clave step"><b>Este nombre es el que vale hoy.</b> Algunos libros dicen tetraoxosulfato(VI) de hidrógeno: es el ácido sulfúrico.</div>
  </div>
</section>

<section data-titulo="5. Qué es una sal">
  <div class="inner">
    <h2>5. Una sal nace cuando el ácido suelta su hidrógeno</h2>
    <p>Un ácido y un hidróxido reaccionan: el hidrógeno del ácido sale y en su lugar entra el metal. Queda una sal y se forma agua. Es como cambiar de pareja en un baile.</p>
    <svg class="dib" viewBox="0 0 860 176" role="img" aria-label="HCl más NaOH da NaCl más agua. El hidrógeno del ácido y el sodio del hidróxido intercambian lugares" style="max-width:780px;margin:0 auto">
      <path d="M92 56C130 8 250 8 262 56" fill="none" stroke="#FFC800" stroke-width="4"/><path d="M258 56l-11-15 15-4z" fill="#FFC800"/>
      <path d="M268 96C240 150 120 150 96 96" fill="none" stroke="#FFC800" stroke-width="4"/><path d="M92 96l15 5-4 15z" fill="#FFC800"/>
      <g fill="#4FB3E8"><circle cx="86" cy="76" r="20"/><circle cx="694" cy="76" r="20"/></g>
      <g fill="#3BC97A"><circle cx="134" cy="76" r="26"/><circle cx="556" cy="76" r="26"/></g>
      <g fill="#C0C9CE"><circle cx="266" cy="76" r="24"/><circle cx="508" cy="76" r="24"/></g>
      <g fill="#FF6B6B"><circle cx="318" cy="76" r="26"/><circle cx="746" cy="76" r="26"/></g>
      <circle cx="366" cy="76" r="20" fill="#4FB3E8"/><circle cx="794" cy="76" r="20" fill="#4FB3E8"/>
      <g fill="#0E1A1F" font-family="Nunito,sans-serif" font-size="19" font-weight="900" text-anchor="middle"><text x="86" y="83">H</text><text x="134" y="83">Cl</text><text x="266" y="83">Na</text><text x="318" y="83">O</text><text x="366" y="83">H</text><text x="508" y="83">Na</text><text x="556" y="83">Cl</text><text x="694" y="83">H</text><text x="746" y="83">O</text><text x="794" y="83">H</text></g>
      <g fill="#F1F5F7" font-family="Nunito,sans-serif" font-size="30" font-weight="900" text-anchor="middle"><text x="200" y="86">+</text><text x="622" y="86">+</text></g>
      <path d="M404 76h58" stroke="#3BC97A" stroke-width="5"/><path d="M476 76l-18-9v18z" fill="#3BC97A"/>
      <g fill="#A9BCC4" font-family="Nunito,sans-serif" font-size="18" font-weight="800" text-anchor="middle"><text x="110" y="166">ácido</text><text x="316" y="166">hidróxido</text><text x="532" y="166">sal</text><text x="744" y="166">agua</text></g>
    </svg>
    <table class="t step">
      <tr><th>El ácido termina en</th><th>La sal termina en</th><th>Ejemplo</th></tr>
      <tr><td>-hídrico</td><td>-uro</td><td>ácido clorhídrico da cloruro</td></tr>
      <tr><td>-oso</td><td>-ito</td><td>ácido hipocloroso da hipoclorito, ácido sulfuroso da sulfito</td></tr>
      <tr><td>-ico</td><td>-ato</td><td>ácido sulfúrico da sulfato, ácido nítrico da nitrato</td></tr>
    </table>
    <div class="clave step"><b>Pregunta para el chat:</b> ¿qué sal sale del ácido carbónico? Carbonato. El de calcio es el del mármol y las conchas.</div>
  </div>
</section>

<section data-titulo="6. Escribir y nombrar sales">
  <div class="inner">
    <h2>6. Escribir y nombrar sales</h2>
    <p style="margin-bottom:6px">Se cruzan las cargas del metal y del ion. Si el ion tiene varios átomos y baja un número mayor que 1, va entre paréntesis. Al<sup>3+</sup> con SO<sub>4</sub><sup>2−</sup> da Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub>: 2(+3) + 3(−2) = 0.</p>
    <table class="t" style="font-size:.86em">
      <tr><th>Fórmula</th><th>Nombre actual</th><th>Nombre tradicional</th><th>Dónde lo ves</th></tr>
      <tr><td>NaCl</td><td>cloruro de sodio</td><td>cloruro sódico</td><td>La sal de mesa</td></tr>
      <tr><td>FeCl<sub>3</sub></td><td>cloruro de hierro(III)</td><td>cloruro férrico</td><td>Limpiar agua sucia</td></tr>
      <tr><td>CaCO<sub>3</sub></td><td>carbonato de calcio</td><td>carbonato cálcico</td><td>Conchas y mármol</td></tr>
      <tr><td>NaClO</td><td>hipoclorito de sodio</td><td>hipoclorito sódico</td><td>El cloro de lavar</td></tr>
      <tr><td>KNO<sub>3</sub></td><td>nitrato de potasio</td><td>nitrato potásico</td><td>Fertilizantes</td></tr>
      <tr><td>CuSO<sub>4</sub></td><td>sulfato de cobre(II)</td><td>sulfato cúprico</td><td>Piscinas y cultivos</td></tr>
      <tr><td>Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub></td><td>sulfato de aluminio</td><td>sulfato alumínico</td><td>Potabilizar agua</td></tr>
      <tr><td>Ca<sub>3</sub>(PO<sub>4</sub>)<sub>2</sub></td><td>fosfato de calcio</td><td>fosfato cálcico</td><td>Tus huesos</td></tr>
    </table>
    <div class="clave step"><b>Pregunta para el chat:</b> ¿cuál es la fórmula del nitrato de calcio? Ca<sup>2+</sup> con NO<sub>3</sub><sup>−</sup> da Ca(NO<sub>3</sub>)<sub>2</sub>.</div>
  </div>
</section>

<section data-titulo="7. No todo lo que termina en uro es sal">
  <div class="inner">
    <h2>7. No todo lo que termina en -uro es sal</h2>
    <p>Una sal tiene iones: un metal, o amonio, unido a un no metal o a un grupo con carga. Si son dos no metales, comparten electrones y forman moléculas. Se nombran con prefijos, como los óxidos de no metal.</p>
    <div class="grid2">
      <table class="t">
        <tr><th>Fórmula</th><th>Molecular, no es sal</th></tr>
        <tr><td>PCl<sub>3</sub></td><td>tricloruro de fósforo</td></tr>
        <tr><td>BrCl</td><td>cloruro de bromo</td></tr>
        <tr><td>CCl<sub>4</sub></td><td>tetracloruro de carbono</td></tr>
        <tr><td>SF<sub>6</sub></td><td>hexafluoruro de azufre</td></tr>
      </table>
      <div class="card"><h3>Sales con hidrógeno</h3><p style="margin:0">Si el ácido suelta solo parte de sus hidrógenos, queda una sal ácida. NaHCO<sub>3</sub> es el hidrogenocarbonato de sodio. Su nombre tradicional es bicarbonato de sodio, el de la cocina.</p></div>
    </div>
    <div class="clave step"><b>Para reconocerlos:</b> hidrácido es H con un no metal, sin oxígeno. Oxoácido es H, no metal y oxígeno. Sal es un metal con un no metal o con un ion como SO<sub>4</sub><sup>2−</sup>. Molecular son dos no metales, sin H adelante.</div>
    <div class="clave step"><b>Pregunta para el chat:</b> ¿el BrCl es una sal? No: bromo y cloro son no metales, así que forman una molécula.</div>
  </div>
</section>
