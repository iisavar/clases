<template id="laminas">
<section data-titulo="1. Un rompecabezas de cartas">
  <div class="inner">
    <h2>1. La historia de un rompecabezas</h2>
    <p>En 1869, el químico ruso Dmitri Mendeléiev ordenó los 63 elementos que se conocían entonces, de menor a mayor masa. Notó que sus propiedades se repetían cada cierto tramo, como los días de la semana. De ahí viene la palabra <b>periódica</b>.</p>
    <p>Lo más valiente fue dejar casillas vacías. Dijo que ahí iban elementos que nadie había descubierto, y hasta anunció cómo serían.</p>
    <div class="clave step"><b>Acertó.</b> En 1875 se descubrió el galio, con casi las mismas propiedades que Mendeléiev había anunciado para una de esas casillas.</div>
    <div class="clave step"><b>El orden de hoy:</b> en 1913, Henry Moseley mostró que lo que ordena a los elementos no es la masa sino el número atómico. La tabla actual va de Z en Z y tiene 118 elementos.</div>
  </div>
</section>

<section data-titulo="2. Cómo se lee una casilla">
  <div class="inner">
    <h2>2. Cómo se lee una casilla</h2>
    <p>Cada casilla es la ficha de un elemento. Sus números ya los conocemos.</p>
    <div class="grid2" style="align-items:center">
      <svg class="dib" viewBox="0 0 420 250" role="img" aria-label="Casilla del sodio con el número atómico 11, el símbolo Na, el nombre y la masa 23" style="max-width:440px;margin:0 auto">
        <rect x="130" y="16" width="170" height="210" rx="14" fill="#1B2B32" stroke="#FFC800" stroke-width="3"/>
        <g font-family="Nunito,sans-serif" text-anchor="middle" fill="#F1F5F7">
          <text x="215" y="62" font-size="30" font-weight="900" fill="#FF6B6B">11</text>
          <text x="215" y="134" font-size="68" font-weight="900">Na</text>
          <text x="215" y="168" font-size="22" font-weight="800">Sodio</text>
          <text x="215" y="206" font-size="24" font-weight="900" fill="#FFC800">23</text>
        </g>
        <g fill="none" stroke-width="3" stroke-linecap="round"><path d="M190 52h-68" stroke="#FF6B6B"/><path d="M190 200h-68" stroke="#FFC800"/></g>
        <g font-family="Nunito,sans-serif" font-weight="800" font-size="19" text-anchor="end">
          <text x="116" y="48" fill="#FF6B6B">Número</text><text x="116" y="70" fill="#FF6B6B">atómico</text>
          <text x="116" y="196" fill="#FFC800">Masa</text><text x="116" y="218" fill="#FFC800">promedio</text>
        </g>
        <g font-family="Nunito,sans-serif" font-weight="800" font-size="19" fill="#F1F5F7">
          <text x="312" y="122">Símbolo</text><path d="M308 116h-10" stroke="#F1F5F7" stroke-width="3" stroke-linecap="round"/>
        </g>
      </svg>
      <div>
        <p>El número de arriba es <b>Z</b>: los protones. El de abajo es el promedio de los isótopos que vimos con el cloro. En este curso lo usamos redondeado.</p>
        <div class="clave"><b>Los símbolos</b> tienen una o dos letras. La primera va en mayúscula y la segunda en minúscula: Co es cobalto, en cambio CO es carbono con oxígeno.</div>
        <p class="step">Algunos vienen del latín: Na de <i>natrium</i>, K de <i>kalium</i>, Fe de <i>ferrum</i>. Por eso no se parecen al nombre en español.</p>
      </div>
    </div>
  </div>
</section>

<section data-titulo="4. Ubicar con la configuración">
  <div class="inner">
    <h2>4. La configuración es la dirección</h2>
    <p>La tabla no se memoriza, se lee. La configuración de la clase pasada te dice dónde vive cada elemento.</p>
    <div class="grid2">
      <div class="card"><h3>Periodo</h3><p style="margin:0">Es el nivel más alto ocupado.</p></div>
      <div class="card"><h3>Grupo</h3><p style="margin:0">Si termina en s, el exponente. Si termina en p, 12 + el exponente.</p></div>
    </div>
    <table class="t" style="margin-top:12px">
      <tr><th>Átomo</th><th>Termina en</th><th>Periodo</th><th>Grupo</th></tr>
      <tr><td>Sodio</td><td>3s<sup>1</sup></td><td>3</td><td>1</td></tr>
      <tr class="step"><td>Magnesio</td><td>3s<sup>2</sup></td><td>3</td><td>2</td></tr>
      <tr class="step"><td>Aluminio</td><td>3s<sup>2</sup> 3p<sup>1</sup></td><td>3</td><td>12 + 1 = 13</td></tr>
      <tr class="step"><td>Cloro</td><td>3s<sup>2</sup> 3p<sup>5</sup></td><td>3</td><td>12 + 5 = 17</td></tr>
    </table>
    <div class="clave step"><b>Pregunta para el chat:</b> un elemento termina en 2s<sup>2</sup> 2p<sup>4</sup>, ¿dónde está? Periodo 2, grupo 16. Es el oxígeno.</div>
  </div>
</section>

          <tr><td>Metales</td><td>Brillan, conducen calor y electricidad, se doblan sin romperse</td></tr>

          <tr class="step"><td>Metaloides</td><td>Intermedios. El silicio se usa en los chips</td></tr>
        </table>
      </div>
    </div>
    <div class="clave step"><b>Pregunta para el chat:</b> ¿por qué los cables son de cobre y no de azufre? El cobre es un metal y conduce la electricidad. El azufre es un no metal y casi no conduce.</div>
  </div>
</section>

<section data-titulo="7. Las familias">
  <div class="inner">
    <h2>7. Las familias se parecen</h2>
    <p>En los grupos 1, 2 y del 13 al 18, los elementos de una misma columna tienen los mismos electrones de valencia. Por eso reaccionan parecido, como una familia con los mismos gestos.</p>
    <table class="t">
      <tr><th>Grupo</th><th>Familia</th><th>De valencia</th><th>Cómo son</th></tr>
      <tr><td>1</td><td>Alcalinos</td><td>1</td><td>Blandos y muy reactivos. El sodio reacciona fuerte con el agua</td></tr>
      <tr class="step"><td>2</td><td>Alcalinotérreos</td><td>2</td><td>Reactivos. El calcio está en tus huesos</td></tr>
      <tr class="step"><td>3 a 12</td><td>Transición</td><td>Varía</td><td>Los metales de uso diario: hierro, cobre, oro, plata</td></tr>
      <tr class="step"><td>17</td><td>Halógenos</td><td>7</td><td>No metales muy reactivos. El cloro limpia las piscinas</td></tr>
      <tr class="step"><td>18</td><td>Gases nobles</td><td>8, el helio 2</td><td>Casi no reaccionan. El neón ilumina letreros</td></tr>
    </table>
    <div class="clave step"><b>Truco:</b> del grupo 13 al 18, los electrones de valencia son el grupo menos 10. El cloro, grupo 17, tiene 7.</div>
