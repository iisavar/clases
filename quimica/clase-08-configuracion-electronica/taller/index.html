<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taller de configuraciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#131F24;--panel:#1B2B32;--panel2:#22363F;--line:#2E4652;--text:#F1F5F7;--muted:#A9BCC4;--green:#2BAE66;--green-d:#1F8A4F;--gold:#FFC800;--red:#FF6B6B;--blue:#4FB3E8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Nunito,sans-serif}
body.bien{background:#163A28} body.mal{background:#3A1B1F}
main{max-width:620px;margin:0 auto;padding:16px 14px 40px}
body.host main{max-width:1100px}
h1{font-weight:900;font-size:28px;margin:6px 0}
.marca{color:var(--green);font-weight:900;margin:0}
.muted{color:var(--muted)}
button{font-family:inherit;font-weight:900;border:0;border-radius:14px;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.45;cursor:default}
.principal{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);font-size:19px;padding:14px 20px;width:100%}
.sec{background:var(--panel2);color:var(--text);font-size:16px;padding:12px 14px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.nivel{background:var(--panel2);border-radius:99px;padding:4px 12px;font-weight:900;font-size:14px;color:var(--gold)}
.barra{flex:1;height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}.barra i{display:block;height:100%;background:var(--green);transition:width .3s}
.reloj{font-weight:900;color:var(--muted);min-width:52px;text-align:right;font-size:18px}
.reloj.poco{color:var(--red)}
.q{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px 16px;font-size:20px;font-weight:900}
.q small{display:block;color:var(--muted);font-size:15px;font-weight:700;margin-top:4px}
.linea{min-height:64px;margin:12px 0 6px;background:#0E171B;border:2px dashed var(--line);border-radius:16px;padding:12px 14px;font-size:28px;font-weight:900;word-break:break-word}
.linea .vacio{color:var(--muted);font-size:17px;font-weight:700}
.linea span{display:inline-block;margin-right:8px;animation:pop .25s}
.linea span.abierto{color:var(--gold)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:none}}
.cuenta{display:flex;justify-content:space-between;font-weight:800;color:var(--muted);margin:2px 2px 10px}
.cuenta b{color:var(--text)}
.e-barra{height:14px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-bottom:12px}.e-barra i{display:block;height:100%;background:var(--blue);transition:width .2s}
.e-barra i.pasado{background:var(--red)}
.teclas{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.tecla{background:var(--panel2);color:var(--text);font-size:24px;padding:12px 4px 8px;box-shadow:0 4px 0 #0E171B;border:2px solid var(--line)}
.tecla small{display:block;font-size:12px;color:var(--muted);font-weight:800}
.tecla:active{transform:translateY(3px);box-shadow:0 1px 0 #0E171B}
.tecla.s{border-color:#4FB3E8}.tecla.p{border-color:#2BAE66}.tecla.d{border-color:#FFC800}
.acciones{display:grid;grid-template-columns:1fr 1fr 2fr;gap:9px;margin-top:12px}
.msg{min-height:26px;margin:12px 2px 0;font-weight:800;font-size:17px}
.msg.mal{color:var(--red)} .msg.bien{color:#3BC97A} .msg.info{color:var(--gold)}
.sacude{animation:sac .35s}
@keyframes sac{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}
.nums button{font-size:26px;padding:14px 0;background:var(--panel2);color:var(--text);border:2px solid var(--line)}
.elems{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.elems button{font-size:24px;padding:12px 4px;background:var(--panel2);color:var(--text);border:2px solid var(--line)}
.elems small{display:block;font-size:13px;color:var(--muted);font-weight:700}
.ok-card{background:#163A28;border-radius:18px;padding:16px;margin-top:12px;font-weight:800;font-size:17px;animation:pop .3s}
.centro{text-align:center}
.grande{font-size:clamp(30px,6vw,56px);font-weight:900;margin:8px 0}
.res{background:var(--panel);border-radius:16px;padding:14px;font-weight:800;margin:14px 0;word-break:break-word}
.card{background:var(--panel);border-radius:18px;padding:16px;margin:14px 0}
.card ol{padding-left:20px;margin:8px 0}.card li{margin:6px 0}
label{display:block;font-weight:800;margin:12px 0 6px;color:var(--muted)}
input{width:100%;font:900 24px Nunito,sans-serif;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text)}
.aviso{background:#3A1B1F;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.pin{font-size:clamp(48px,9vw,96px);font-weight:900;color:var(--gold);letter-spacing:.08em;line-height:1}
.jug{display:flex;flex-wrap:wrap;gap:10px;list-style:none;padding:0;margin:18px 0}
.jug li{background:var(--panel2);border-radius:999px;padding:8px 16px;font-weight:800;font-size:20px;animation:pop .4s}
.jug li.listo{background:var(--green)}
.fila{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.retohost{font-size:clamp(30px,4.5vw,52px);font-weight:900;background:var(--panel);border-radius:22px;padding:24px;text-align:center;margin:10px 0}
.retohost small{display:block;font-size:.45em;color:var(--muted);margin-top:8px}
.relojg{font-size:72px;font-weight:900;text-align:center}
.relojg.poco{color:var(--red)}
.sol{font-size:clamp(28px,4vw,46px);font-weight:900;color:var(--gold);text-align:center;background:#0E171B;border-radius:18px;padding:18px;margin:10px 0}
.rank{list-style:none;padding:0;margin:16px 0;display:grid;gap:10px}
.rank li{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:14px;padding:12px 18px;font-size:22px;font-weight:900;animation:pop .4s}
.rank .n{color:var(--gold);min-width:30px}.rank .p{margin-left:auto;color:#3BC97A}.rank .d{color:var(--muted);font-size:16px}
.podio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:end;margin:20px 0}
.podio div{background:var(--panel);border-radius:18px 18px 0 0;text-align:center;padding:16px 8px;font-weight:900;font-size:22px}
.podio .p1{min-height:230px;border-top:6px solid var(--gold)}.podio .p2{min-height:180px;border-top:6px solid #C0C8CC}.podio .p3{min-height:140px;border-top:6px solid #C77B30}
.podio b{display:block;font-size:44px}
.confeti{position:fixed;top:-20px;width:10px;height:16px;z-index:9;animation:cae linear forwards;pointer-events:none}
@keyframes cae{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" integrity="sha384-nlUQ8ZqCbvStErob+biJNzSgltf6urV3VGqhfIfzhmg9RXmpeRm76ELw0pYnKlTR" crossorigin="anonymous"></script>
<script>
/* Taller de la clase 8: armar configuraciones tocando subniveles (cada toque = 1 electrón).
   En vivo (?anfitrion en la pantalla del docente): todos juegan la misma ronda con el mismo reloj y suman puntos.
   Sin sala: práctica individual con los 27 retos. */
const ORDEN=['1s','2s','2p','3s','3p','4s','3d','4p'];
const CAP={s:2,p:6,d:10};
const EL=['','H hidrógeno','He helio','Li litio','Be berilio','B boro','C carbono','N nitrógeno','O oxígeno','F flúor','Ne neón','Na sodio','Mg magnesio','Al aluminio','Si silicio','P fósforo','S azufre','Cl cloro','Ar argón','K potasio','Ca calcio','Sc escandio','Ti titanio','V vanadio','Cr cromo','Mn manganeso','Fe hierro'];
const sim=z=>EL[z].split(' ')[0], nom=z=>EL[z].split(' ')[1];
function conf(e){const r=[];for(const s of ORDEN){if(e<=0)break;const n=Math.min(e,CAP[s[1]]);r.push([s,n]);e-=n}return r}
function valencia(e){const c=conf(e),top=Math.max(...c.map(x=>+x[0][0]));return c.filter(x=>+x[0][0]===top).reduce((a,x)=>a+x[1],0)}
const sup=n=>String(n).split('').map(d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d]).join('');
const txt=c=>c.map(([s,n])=>s+sup(n)).join(' ');
const carga=q=>q===0?'':(Math.abs(q)===1?'':sup(Math.abs(q)))+(q>0?'⁺':'⁻');
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const electrones=r=>r.z-(r.q||0);
function titulo(r){return r.quien?'¿Quién soy?':r.q?`Arma el ion ${sim(r.z)}${carga(r.q)}`:`Arma el ${nom(r.z)} (${sim(r.z)})`}
function subtitulo(r){return r.quien?'Cuenta los electrones y busca el elemento.':r.q?`El ${nom(r.z)} tiene Z = ${r.z}. Primero piensa cuántos electrones tiene el ion.`:`Z = ${r.z}`+(r.val?' · después: electrones de valencia':'')}

/* Práctica individual */
const NIVELES=[
 {t:'Nivel 1 · Calentamiento',r:[{z:3},{z:5},{z:7},{z:9},{z:10}]},
 {t:'Nivel 2 · Nivel 3 y valencia',r:[{z:11,val:1},{z:12,val:1},{z:13,val:1},{z:15,val:1},{z:16,val:1},{z:17,val:1}]},
 {t:'Nivel 3 · La trampa del 4s',r:[{z:19,val:1},{z:20,val:1},{z:21},{z:23},{z:26}]},
 {t:'Nivel 4 · Iones',r:[{z:11,q:1},{z:8,q:-2},{z:12,q:2},{z:17,q:-1},{z:16,q:-2},{z:20,q:2}]},
 {t:'Nivel 5 · ¿Quién soy?',r:[{quien:6},{quien:14},{quien:18},{quien:19},{quien:25}]}
];
const RETOS=[];NIVELES.forEach(n=>n.r.forEach(r=>RETOS.push({...r,nivel:n.t})));
/* Rondas en vivo: 14, de menos a más */
const RONDAS=[{z:8},{z:11,val:1},{z:13,val:1},{z:16,val:1},{z:17,val:1},{z:19,val:1},{z:20,val:1},{z:26},
 {z:11,q:1},{z:8,q:-2},{z:17,q:-1},{z:12,q:2},{quien:14},{quien:25}];
const TIEMPO=r=>r.quien?40:90;

const app=document.getElementById('app');
function tono(f,d){try{const a=window.__a||(window.__a=new (window.AudioContext||window.webkitAudioContext)());const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.start();o.stop(a.currentTime+d)}catch(e){}}
function confeti(n){const C=['#FFC800','#2BAE66','#4FB3E8','#FF6B6B','#fff'];for(let i=0;i<n;i++){const d=document.createElement('i');d.className='confeti';d.style.left=Math.random()*100+'vw';d.style.background=C[i%5];d.style.animationDuration=(1.4+Math.random()*1.6)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}}
const mmss=ms=>{const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function fondo(c){document.body.className=(document.body.classList.contains('host')?'host ':'')+(c||'')}

/* ---------- Pantallas de juego (las usan la práctica y el vivo) ----------
   jugar(r, cab, fin): pinta el reto; fin({ok, fallos, val}) se llama una sola vez. */
function jugar(r,cab,fin){
 fondo('');
 if(r.quien)return quien(r,cab,fin);
 const e=electrones(r), meta=conf(e);let hecho=[],fallos=0,listo=false;
 app.innerHTML=cab+`<div class="q">${titulo(r)}<small>${subtitulo(r)}</small></div>
  <div class="linea" id="linea"></div>
  <div class="cuenta"><span>Electrones puestos: <b id="van">0</b></span><span>${r.q?'¿Cuántos son?':'Meta: <b>'+e+'</b>'}</span></div>
  <div class="e-barra"><i id="eb" style="width:0"></i></div>
  <div class="teclas">${ORDEN.map(s=>`<button class="tecla ${s[1]}" data-s="${s}">${s}<small>tope ${CAP[s[1]]}</small></button>`).join('')}</div>
  <div class="acciones"><button class="sec" id="undo">↶ Uno</button><button class="sec" id="borrar">Borrar</button><button class="principal" id="rev" style="width:auto">Revisar</button></div>
  <div class="msg" id="msg"></div><div id="extra"></div>`;
 const $=id=>document.getElementById(id), total=()=>hecho.reduce((a,x)=>a+x[1],0);
 function pintar(){$('linea').innerHTML=hecho.length?hecho.map(([s,n])=>`<span class="${n===CAP[s[1]]?'':'abierto'}">${s}${sup(n)}</span>`).join(''):'<span class="vacio">Toca los subniveles para meter electrones…</span>';
  const t=total();$('van').textContent=t;const tope=r.q?Math.max(e,t,1):e;const b=$('eb');b.style.width=Math.min(100,t/tope*100)+'%';b.classList.toggle('pasado',!r.q&&t>e)}
 function aviso(t,c){const m=$('msg');if(!m)return;m.className='msg '+(c||'');m.textContent=t;if(c==='mal'){m.classList.remove('sacude');void m.offsetWidth;m.classList.add('sacude')}}
 pintar();
 app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
  const s=b.dataset.s, ult=hecho[hecho.length-1];
  if(total()>=30){aviso('Ya son demasiados electrones.','mal');return}
  if(ult&&ult[0]===s){if(ult[1]>=CAP[s[1]]){aviso(`El subnivel ${s} ya está lleno: admite ${CAP[s[1]]}.`,'mal');tono(200,.15);return}ult[1]++}
  else if(hecho.some(x=>x[0]===s)){aviso(`Ya usaste el ${s}. Sigue con el que viene.`,'mal');tono(200,.15);return}
  else hecho.push([s,1]);
  tono(420+total()*12,.05);aviso('');pintar()});
 $('undo').onclick=()=>{const u=hecho[hecho.length-1];if(!u)return;u[1]--;if(!u[1])hecho.pop();aviso('');pintar()};
 $('borrar').onclick=()=>{hecho=[];aviso('');pintar()};
 function bloquear(){app.querySelectorAll('.tecla,#undo,#borrar,#rev').forEach(x=>x.disabled=true)}
 $('rev').onclick=()=>{
  const t=total();
  if(!t){aviso('Primero mete electrones tocando los subniveles.','info');return}
  if(txt(hecho)===txt(meta)){tono(660,.12);setTimeout(()=>tono(990,.2),120);confeti(16);bloquear();
   aviso('¡Correcto! '+txt(meta),'bien');
   if(r.val)pedirValencia(e,v=>fin({ok:true,fallos,val:v}));else fin({ok:true,fallos,val:null});
   return}
  fallos++;tono(180,.25);
  let pista;
  if(t!==e)pista=r.q?`Pusiste ${t} electrones. Un ion ${r.q>0?'positivo perdió':'negativo ganó'} ${Math.abs(r.q)}.`:`Pusiste ${t} electrones y el ${nom(r.z)} tiene ${e}.`;
  else{const k=hecho.findIndex((x,i)=>!meta[i]||x[0]!==meta[i][0]||x[1]!==meta[i][1]);const x=hecho[k],m=meta[k];
   if(!m||x[0]!==m[0])pista=k===0?'Siempre se empieza por el 1s.':`Después de ${meta[k-1][0]} no va ${x[0]}: revisa el orden de llenado.`;
   else pista=`El ${m[0]} quedó con ${x[1]}. Llénalo hasta su tope (${CAP[m[0][1]]}) antes de pasar al siguiente, si te alcanzan los electrones.`}
  aviso('Todavía no. '+pista,'mal');
 };
 return {bloquear};
}
function pedirValencia(e,fin){
 const v=valencia(e),x=document.getElementById('extra');
 x.innerHTML=`<div class="q" style="margin-top:12px;font-size:18px">¿Cuántos electrones de valencia tiene?<small>Suma los del último nivel. Tienes un solo intento.</small></div>
  <div class="nums">${[1,2,3,4,5,6,7,8].map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div>`;
 x.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.n===v;x.querySelectorAll('[data-n]').forEach(y=>y.disabled=true);
  tono(ok?990:180,.2);x.insertAdjacentHTML('beforeend',`<div class="msg ${ok?'bien':'mal'}">${ok?'¡Sí! Tiene '+v+' de valencia.':'No: tiene '+v+'. Mira solo el nivel más alto.'}</div>`);fin(ok)})
}
function quien(r,cab,fin){
 const z=r.quien, ops=new Set([z]);const cand=[z-2,z-1,z+1,z+2,z-3,z+3,z+8,z-8].filter(x=>x>=1&&x<=26&&x!==24);
 while(ops.size<6&&cand.length)ops.add(cand.splice(Math.floor(Math.random()*cand.length),1)[0]);
 const lista=[...ops].sort(()=>Math.random()-.5);
 app.innerHTML=cab+`<div class="q">¿Quién soy?<small>Cuenta los electrones y busca el elemento. Tienes un solo intento.</small></div>
  <div class="linea">${conf(z).map(([s,n])=>`<span>${s}${sup(n)}</span>`).join('')}</div>
  <div class="elems">${lista.map(x=>`<button data-z="${x}">${sim(x)}<small>${nom(x)}</small></button>`).join('')}</div><div class="msg" id="msg"></div><div id="extra"></div>`;
 app.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{const ok=+b.dataset.z===z;app.querySelectorAll('[data-z]').forEach(x=>x.disabled=true);
  const m=document.getElementById('msg');m.className='msg '+(ok?'bien':'mal');m.textContent=ok?`¡Sí! Los exponentes suman ${z}: es el ${nom(z)}.`:`No. Los exponentes suman ${z}: es el ${nom(z)}.`;
  tono(ok?990:180,.2);if(ok)confeti(14);fin({ok,fallos:0,val:null})});
 return {bloquear(){app.querySelectorAll('[data-z]').forEach(x=>x.disabled=true)}};
}
/* Puntos: 100 por acertar (−10 por cada «Revisar» fallido, mínimo 60) + hasta 50 por rapidez + 50 por la valencia. */
function puntos(res,ms,T){if(!res||!res.ok)return 0;return Math.max(60,100-10*res.fallos)+Math.round(50*Math.max(0,1-ms/(T*1000)))+(res.val?50:0)}

/* ---------- Pantalla del docente ---------- */
const PREF='cidea-q8-taller-';
function anfitrion(){
 document.body.classList.add('host');
 let jug={},peer,ronda=null,t=null,pin=String(Math.floor(1000+Math.random()*9000));
 const lista=()=>Object.values(jug), orden=()=>lista().sort((a,b)=>b.pts-a.pts);
 const env=(j,d)=>{if(j.c&&j.c.open)j.c.send(d)}, todos=d=>lista().forEach(j=>env(j,d));
 function abrir(){peer=new Peer(PREF+pin);
  peer.on('open',sala);
  peer.on('disconnected',()=>{if(!peer.destroyed)peer.reconnect()});
  peer.on('connection',c=>c.on('data',d=>recibir(c,d)));
  peer.on('error',e=>{if(e.type==='unavailable-id'){pin=String(Math.floor(1000+Math.random()*9000));abrir();return}
   if(!ronda)app.innerHTML='<div class="aviso">No se pudo abrir la sala. Revisa el internet y recarga la página.</div>'})}
 function recibir(c,d){
  if(d.t==='hola'){let n=String(d.nombre||'').trim().slice(0,24);if(!n)return;let k=n.toLowerCase(),b=n,i=1;
   while(jug[k]&&jug[k].c&&jug[k].c.open&&jug[k].c!==c){i++;n=b+' '+i;k=n.toLowerCase()}
   if(!jug[k])jug[k]={n,pts:0,aciertos:0};jug[k].c=c;c.k=k;c.send({t:'ok',nombre:n});tono(660,.12);
   if(ronda&&!ronda.cerrada)c.send(msg());if(!ronda)sala();else pintarListos()}
  else if(d.t==='r'&&ronda&&!ronda.cerrada&&c.k&&!(c.k in ronda.resp)){
   ronda.resp[c.k]={ok:!!d.ok,fallos:Math.max(0,+d.fallos||0),val:d.val===true,ms:Date.now()-ronda.ini};
   tono(760,.08);pintarListos();if(Object.keys(ronda.resp).length>=lista().length)cerrar()}}
 function sala(){fondo('');const enlace=location.origin+location.pathname+'?aula='+pin;
  app.innerHTML=`<p class="marca">Taller en vivo · Configuración electrónica</p><h1>Entren desde el celular</h1>
   <div class="card fila" style="justify-content:space-between"><div><div class="muted">Código del aula</div><div class="pin">${pin}</div></div>
   <div style="max-width:440px"><div class="muted">Enlace para el chat</div><div style="word-break:break-all;font-weight:800;margin:6px 0 10px">${esc(enlace)}</div>
   <button class="sec" id="copiar">Copiar enlace</button></div></div>
   <div class="card"><b>Reglas:</b> ${RONDAS.length} rondas. Todos juegan la misma con el mismo reloj (90 s para armar, 40 s para «¿Quién soy?»). Armarla bien: 100 puntos (−10 por cada «Revisar» fallido) + hasta 50 por rapidez. La valencia bien: +50.</div>
   <ul class="jug">${lista().map(j=>`<li>${esc(j.n)}</li>`).join('')}</ul>
   <div class="fila" style="justify-content:space-between"><span class="muted" style="font-weight:800">${lista().length} conectados</span>
   <button class="principal" id="ini" style="width:auto" ${lista().length?'':'disabled'}>Empezar ▶</button></div>`;
  document.getElementById('copiar').onclick=function(){const b=this;(navigator.clipboard?navigator.clipboard.writeText(enlace):Promise.reject()).then(()=>b.textContent='Enlace copiado',()=>prompt('Copia este enlace:',enlace))};
  document.getElementById('ini').onclick=()=>lanzar(0)}
 const msg=()=>({t:'q',i:ronda.i,total:RONDAS.length,r:RONDAS[ronda.i],resta:ronda.fin-Date.now()});
 function pintarListos(){const ul=document.getElementById('listos');if(!ul)return;
  ul.innerHTML=lista().map(j=>`<li class="${ronda.resp[j.n.toLowerCase()]?'listo':''}">${esc(j.n)}</li>`).join('');
  document.getElementById('conteo').textContent=Object.keys(ronda.resp).length+' de '+lista().length+' terminaron'}
 function lanzar(i){fondo('');const r=RONDAS[i],T=TIEMPO(r);
  ronda={i,ini:Date.now(),fin:Date.now()+T*1000,resp:{},cerrada:false};todos(msg());tono(520,.15);
  app.innerHTML=`<div class="top"><span class="nivel">Ronda ${i+1} de ${RONDAS.length}</span><div class="barra"><i style="width:${i/RONDAS.length*100}%"></i></div></div>
   <div class="retohost">${titulo(r)}<small>${subtitulo(r)}</small>${r.quien?`<div class="sol" style="margin-top:16px">${txt(conf(r.quien))}</div>`:''}</div>
   <div class="relojg" id="rg">${T}</div><p class="centro muted" style="font-weight:900;font-size:20px" id="conteo"></p><ul class="jug" id="listos" style="justify-content:center"></ul>
   <div class="fila" style="justify-content:flex-end"><button class="sec" id="ya">Cerrar la ronda ya</button></div>`;
  pintarListos();document.getElementById('ya').onclick=cerrar;
  clearInterval(t);t=setInterval(()=>{const q=ronda.fin-Date.now(),el=document.getElementById('rg');if(!el){clearInterval(t);return}
   el.textContent=Math.max(0,Math.ceil(q/1000));el.classList.toggle('poco',q<10000);if(q<=0){clearInterval(t);cerrar()}},200)}
 function cerrar(){if(!ronda||ronda.cerrada)return;ronda.cerrada=true;clearInterval(t);
  const r=RONDAS[ronda.i],T=TIEMPO(r);let bien=0;
  lista().forEach(j=>{const x=ronda.resp[j.n.toLowerCase()],g=x?puntos(x,x.ms,T):0;j.g=g;j.pts+=g;j.ok=!!(x&&x.ok);if(j.ok){j.aciertos++;bien++}});
  const o=orden();o.forEach((j,n)=>env(j,{t:'res',ok:j.ok,g:j.g,pts:j.pts,puesto:n+1,de:o.length,sol:r.quien?nom(r.quien)+' ('+sim(r.quien)+')':txt(conf(electrones(r)))}));
  tono(880,.2);const ult=ronda.i===RONDAS.length-1;
  app.innerHTML=`<p class="marca">Ronda ${ronda.i+1}: ${esc(titulo(r))}</p><div class="sol">${r.quien?nom(r.quien)+' ('+sim(r.quien)+'), Z = '+r.quien:txt(conf(electrones(r)))}</div>
   ${r.val?`<p class="centro" style="font-size:22px;font-weight:900">Valencia: ${valencia(electrones(r))}</p>`:''}
   <p class="centro muted" style="font-size:20px;font-weight:900">${bien} de ${lista().length} la tuvieron bien</p>
   <ol class="rank">${o.slice(0,6).map((j,n)=>`<li><span class="n">${n+1}</span>${esc(j.n)} <span class="d">${j.g?'+'+j.g:''}</span><span class="p">${j.pts}</span></li>`).join('')}</ol>
   <div class="fila" style="justify-content:flex-end"><button class="principal" id="sg" style="width:auto">${ult?'Ver el podio 🏆':'Siguiente ronda ▶'}</button></div>`;
  document.getElementById('sg').onclick=()=>ult?final():lanzar(ronda.i+1)}
 function final(){const o=orden();o.forEach((j,n)=>env(j,{t:'fin',pts:j.pts,puesto:n+1,de:o.length,aciertos:j.aciertos}));confeti(90);tono(784,.2);setTimeout(()=>tono(1046,.4),200);
  const c=(j,k)=>j?`<div class="p${k}"><b>${k}.º</b>${esc(j.n)}<br><span style="color:#3BC97A">${j.pts}</span></div>`:'<div style="visibility:hidden"></div>';
  app.innerHTML=`<p class="marca centro">Podio del taller</p><div class="podio">${c(o[1],2)}${c(o[0],1)}${c(o[2],3)}</div>
   ${o.length>3?`<ol class="rank" start="4">${o.slice(3).map((j,n)=>`<li><span class="n">${n+4}</span>${esc(j.n)} <span class="d">${j.aciertos} de ${RONDAS.length}</span><span class="p">${j.pts}</span></li>`).join('')}</ol>`:''}
   <div class="fila" style="justify-content:center"><button class="sec" id="otra">Jugar otra vez</button></div>`;
  document.getElementById('otra').onclick=()=>{lista().forEach(j=>{j.pts=0;j.aciertos=0});ronda=null;todos({t:'ok'});sala()}}
 app.innerHTML='<p class="muted">Abriendo la sala…</p>';abrir();
}

/* ---------- Celular del estudiante en vivo ---------- */
function espera(a,b){fondo('');app.innerHTML=`<div class="centro" style="margin-top:20vh"><div class="grande">${esc(a)}</div><p class="muted" style="font-weight:800">${esc(b)}</p></div>`}
function jugador(pin,nombre){let dentro=false,t=null,juego=null,enviado=false;espera('Conectando…','Un momento');const peer=new Peer();
 const lim=setTimeout(()=>{if(!dentro){peer.destroy();entrada('No se encontró esa aula. Revisa el código.')}},12000);
 peer.on('error',e=>{if(dentro)return;clearTimeout(lim);peer.destroy();entrada(e.type==='peer-unavailable'?'No se encontró esa aula. Revisa el código.':'No se pudo conectar. Prueba otra vez.')});
 peer.on('open',()=>{const c=peer.connect(PREF+pin,{reliable:true});
  c.on('open',()=>c.send({t:'hola',nombre}));
  c.on('close',()=>{clearInterval(t);if(dentro){app.innerHTML='<div class="aviso">Se cortó la conexión.</div><button class="principal" onclick="location.reload()">Volver a entrar (con el mismo nombre)</button>'}});
  c.on('data',d=>{
   if(d.t==='ok'){dentro=true;clearTimeout(lim);espera('¡Ya estás dentro!','Espera a que empiece la ronda, '+(d.nombre||nombre))}
   else if(d.t==='q'){clearInterval(t);enviado=false;const fin=Date.now()+d.resta;
    const cab=`<div class="top"><span class="nivel">Ronda ${d.i+1} de ${d.total}</span><div class="barra"><i style="width:${d.i/d.total*100}%"></i></div><span class="reloj" id="reloj"></span></div>`;
    juego=jugar(d.r,cab,res=>{if(enviado)return;enviado=true;c.send({t:'r',ok:res.ok,fallos:res.fallos,val:res.val});
     setTimeout(()=>{const x=document.getElementById('extra');if(x)x.insertAdjacentHTML('beforeend','<div class="ok-card">Listo. Espera a que se cierre la ronda para ver tus puntos.</div>')},300)});
    const f=()=>{const el=document.getElementById('reloj');if(!el){clearInterval(t);return}const q=fin-Date.now();el.textContent=mmss(q);el.classList.toggle('poco',q<10000);
     if(q<=0){clearInterval(t);if(juego)juego.bloquear();if(!enviado){const m=document.getElementById('msg');if(m){m.className='msg info';m.textContent='Se acabó el tiempo.'}}}};f();t=setInterval(f,250)}
   else if(d.t==='res'){clearInterval(t);fondo(d.ok?'bien':'mal');if(d.ok){confeti(24);tono(880,.2)}else tono(220,.3);
    app.innerHTML=`<div class="centro" style="margin-top:8vh"><div class="grande">${d.ok?'¡Bien! +'+d.g:'Esta no salió'}</div>
     <p style="font-size:22px;font-weight:900">${d.pts} puntos · puesto ${d.puesto} de ${d.de}</p>
     <div class="res">Respuesta: <span style="color:var(--gold)">${esc(d.sol)}</span></div>
     <p class="muted" style="font-weight:800">${d.ok?'Sigue así.':'Tranquilo: cada ronda suma igual para todos. Vamos por la siguiente.'}</p></div>`}
   else if(d.t==='fin'){fondo('');if(d.puesto<=3)confeti(70);
    app.innerHTML=`<div class="centro" style="margin-top:12vh"><div class="grande">Puesto ${d.puesto} de ${d.de}</div><p style="font-size:26px;font-weight:900;color:var(--gold)">${d.pts} puntos</p><p class="muted" style="font-weight:800">${d.aciertos} de ${RONDAS.length} rondas bien</p></div>`}
  })})}
function entrada(error){fondo('');const aula=new URLSearchParams(location.search).get('aula')||'';let n='';try{n=localStorage.getItem('q8-nombre')||''}catch(e){}
 app.innerHTML=`<p class="marca centro">Clase 8 · en tu celular</p><h1 class="centro">Taller de configuraciones</h1>
  <div class="card">${error?`<div class="aviso">${esc(error)}</div>`:''}
  <label for="pin">Código del aula</label><input id="pin" inputmode="numeric" maxlength="4" value="${esc(aula)}">
  <label for="nom">Tu nombre</label><input id="nom" maxlength="24" value="${esc(n)}">
  <div style="margin-top:16px"><button class="principal" id="entrar">Entrar a la clase</button></div></div>
  <div class="card"><b>Cómo se juega:</b> cada vez que tocas un subnivel metes <b>un electrón</b>. Toca «1s» dos veces y tienes 1s². Llena en orden (1s, 2s, 2p, 3s, 3p, 4s, 3d) y respeta los topes: s 2, p 6, d 10. Cuando tengas todos, toca <b>Revisar</b>.</div>
  <p class="centro"><button class="sec" id="solo">Practicar solo (27 retos)</button></p>`;
 document.getElementById('entrar').onclick=()=>{const p=document.getElementById('pin').value.trim(),nm=document.getElementById('nom').value.trim();
  if(!/^\d{4}$/.test(p)||!nm){entrada('Escribe el código de 4 números que está en la pantalla y tu nombre.');return}
  try{localStorage.setItem('q8-nombre',nm)}catch(e){}
  if(typeof Peer==='undefined'){entrada('No cargó la conexión. Revisa el internet y recarga la página.');return}
  jugador(p,nm)};
 document.getElementById('solo').onclick=()=>practica(0,0,Date.now());
}

/* ---------- Práctica individual ---------- */
function practica(i,pts,ini){
 if(i>=RETOS.length){fondo('');confeti(60);app.innerHTML=`<div class="centro" style="margin-top:10vh"><p class="marca">¡Terminaste los ${RETOS.length} retos!</p><div class="grande">${pts} puntos</div><p class="muted" style="font-weight:800">Tiempo: ${mmss(Date.now()-ini)}</p><button class="sec" onclick="location.reload()">Volver</button></div>`;return}
 const r=RETOS[i],cab=`<div class="top"><span class="nivel">${r.nivel}</span><div class="barra"><i style="width:${i/RETOS.length*100}%"></i></div><span class="reloj">${pts} pts</span></div><p class="muted" style="margin:0 0 8px;font-weight:800">Reto ${i+1} de ${RETOS.length}</p>`;
 const t0=Date.now();
 jugar(r,cab,res=>{const g=puntos(res,Date.now()-t0,TIEMPO(r));
  setTimeout(()=>{const x=document.getElementById('extra');x.insertAdjacentHTML('beforeend',`<div class="ok-card">${g?'+'+g+' puntos':'0 puntos en este'}<br><br><button class="principal" id="sig">Siguiente ▶</button></div>`);
   document.getElementById('sig').onclick=()=>practica(i+1,pts+g,ini)},250)});
}

if(new URLSearchParams(location.search).has('anfitrion')){if(typeof Peer==='undefined')app.innerHTML='<div class="aviso">No cargó la conexión. Revisa el internet y recarga la página.</div>';else anfitrion()}
else entrada();
</script>
</body>
